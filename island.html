<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="googlebot" content="noindex, nofollow">
<title>島嶼探險隊</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --sea:#7cc6e8; --sea-deep:#3a8fbf; --ink:#1f3347; --muted:#5b6b7a;
  --card:#fffdf7; --good:#2e9d5b; --bad:#d9534f; --gold:#f2b632; --line:#e6dcc4;
}
*{box-sizing:border-box}
html{background:#7cc6e8}
html,body{margin:0}
body{font-family:"Noto Sans TC",system-ui,sans-serif;color:var(--ink);font-size:18px;min-height:100vh;
  background:linear-gradient(180deg,#bfe6f7 0%,#9fd6ef 45%,#7cc6e8 100%);}
button{font-family:inherit;cursor:pointer}
#world{position:fixed;inset:0;width:100vw;height:100vh;display:block;z-index:0;touch-action:none}
#hud{position:fixed;inset:0;z-index:2;pointer-events:none}
#hud .hud-in{pointer-events:auto}
#app{position:relative;z-index:3}
/* ---- 遊戲全螢幕模式 ---- */
body.gfull #acct,body.gfull #ttnav{display:none!important}
body.gfull.gfix{overflow:hidden}
body.gfull #app.overlay{background:none;backdrop-filter:none;-webkit-backdrop-filter:none}
body.gfull .wrap{max-width:none;padding:0}
.gframe{position:fixed;left:0;top:0;width:100%;height:100vh;height:100dvh;border:0;display:block;z-index:8}
.gfab{position:fixed;z-index:9;left:calc(6px + env(safe-area-inset-left));bottom:calc(6px + env(safe-area-inset-bottom));display:flex;gap:6px}
.gfab button{width:40px;height:40px;opacity:.92;border-radius:50%;border:2px solid #fff;background:rgba(255,255,255,.9);box-shadow:0 3px 8px rgba(0,0,0,.25);font-size:19px;line-height:1;cursor:pointer;padding:0;font-family:inherit}
.gfab button:active{transform:scale(.92)}
#enghost.gfeng{display:block}

#app.overlay{min-height:100vh;background:rgba(160,214,239,.55);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.wrap{max-width:960px;margin:0 auto;padding:16px 16px 48px}
.topbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.brand{font-weight:900;font-size:26px;letter-spacing:1px;display:flex;align-items:center;gap:8px;text-shadow:0 2px 0 rgba(255,255,255,.6)}
.brand small{font-size:14px;font-weight:500;color:var(--muted)}
.spacer{flex:1}
.pill{background:#fff;border-radius:999px;padding:6px 14px;font-weight:700;box-shadow:0 2px 0 rgba(0,0,0,.08);display:inline-flex;gap:6px;align-items:center}
.btn{border:none;border-radius:14px;padding:12px 18px;font-size:18px;font-weight:700;background:#fff;color:var(--ink);box-shadow:0 3px 0 rgba(0,0,0,.12)}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.12)}
.btn.primary{background:var(--gold);color:#3b2a00}
.btn.ghost{background:rgba(255,255,255,.75)}
.btn.small{padding:8px 12px;font-size:15px;border-radius:10px}
.tog{border:none;border-radius:999px;padding:6px 12px;font-size:15px;font-weight:700;background:rgba(255,255,255,.75);color:var(--muted);box-shadow:0 2px 0 rgba(0,0,0,.08)}
.tog.on{background:#fff;color:var(--ink);outline:2px solid var(--gold)}
.card{background:var(--card);border-radius:20px;padding:20px;box-shadow:0 6px 0 rgba(31,51,71,.10)}
h2{margin:0 0 12px;font-size:24px}
.hidden{display:none!important}

/* zhuyin */
.zc{display:inline-flex;align-items:center;vertical-align:baseline;margin:0 .05em 0 0}
.zc .b{display:inline-flex;flex-direction:column;align-items:center;justify-content:center;font-size:.42em;line-height:1;margin-left:.08em;margin-right:.5em;position:relative;font-weight:500;color:#48607a;min-height:2em}
.zc .b i{font-style:normal;display:block}
.zc .b .t{position:absolute;left:100%;margin-left:.05em;top:50%;transform:translateY(-35%)}
.zc .b .n{line-height:.6}
body.zy .qtext,body.zy .opt,body.zy .feedback,body.zy .passage{letter-spacing:.02em}
/* profile */
.profiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px;margin:12px 0}
.prof{border:3px solid transparent;background:#fff;border-radius:18px;padding:16px;text-align:center;font-size:20px;font-weight:700}
.prof .av{font-size:44px;display:block}
.prof:hover{border-color:var(--gold)}
.addrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.addrow input{flex:1;min-width:160px;font-size:20px;padding:10px 14px;border-radius:12px;border:2px solid var(--line);font-family:inherit}
.avatars{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.avatars button{font-size:28px;border:3px solid transparent;background:#fff;border-radius:12px;padding:4px 8px}
.avatars button.sel{border-color:var(--gold)}

/* 3D HUD */
.hud-top{position:absolute;left:0;right:0;top:0;padding:14px 16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.hint{position:absolute;left:50%;transform:translateX(-50%);bottom:86px;background:rgba(255,255,255,.88);border-radius:999px;padding:8px 18px;font-weight:700;font-size:17px;box-shadow:0 3px 0 rgba(0,0,0,.08);white-space:nowrap;transition:opacity .4s}
.hud-bottom{position:absolute;left:16px;right:110px;bottom:16px;display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end}
.hud-bottom .btn{padding:10px 14px;font-size:16px}
body.panel-open .hud-bottom{right:470px}
@media (max-width:700px){.hud-bottom{right:84px}.hud-bottom .btn{padding:8px 10px;font-size:14px}}
.panel{position:absolute;right:16px;top:72px;bottom:16px;width:340px;max-width:calc(100vw - 32px);overflow:auto;background:rgba(255,253,247,.96);border-radius:22px;box-shadow:0 8px 0 rgba(31,51,71,.14);transform:translateX(120%);transition:transform .45s cubic-bezier(.2,.8,.2,1)}
.panel.open{transform:none}
.panel-head{padding:14px 16px;color:#fff;border-radius:22px 22px 0 0;display:flex;align-items:center;gap:10px}
.panel-head b{font-size:24px;display:block}
.panel-head span{font-size:14px}
.panel .levels{padding:12px}
@media (max-width:700px){
  .panel{left:8px;right:8px;width:auto;top:auto;bottom:8px;max-height:47vh;transform:translateY(120%)}
  .panel.open{transform:none}
  .hint{bottom:132px;font-size:15px}
  .brand small{display:none}
}

.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 14px}
.shop{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.sitem{background:#fff;border:2px solid var(--line);border-radius:16px;padding:14px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px}
.sicon{font-size:46px;line-height:1.1}
.sname{font-weight:900;font-size:18px}
.sdesc{font-size:14px;color:var(--muted);flex:1}
.rwrow{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:6px 0}
.rwrow input{font-size:16px;padding:8px 10px;border-radius:10px;border:2px solid var(--line);font-family:inherit}

/* buddy */
.buddy{position:fixed;right:14px;bottom:12px;z-index:6;display:flex;align-items:flex-end;gap:6px;pointer-events:none}
.buddy .fig{pointer-events:auto;border:none;background:none;padding:0;cursor:pointer;animation:bob 2.6s ease-in-out infinite}
.buddy .bub{pointer-events:none;max-width:240px;background:#fff;border-radius:16px;padding:10px 14px;font-weight:700;font-size:16px;box-shadow:0 4px 0 rgba(0,0,0,.1);opacity:0;transform:translateY(8px);transition:.3s;margin-bottom:40px;position:relative}
.buddy .bub:after{content:"";position:absolute;right:-8px;bottom:14px;border:8px solid transparent;border-left-color:#fff}
.buddy.talk .bub{opacity:1;transform:none}
body.zy .buddy .bub{line-height:2.1}
body.panel-open .buddy{right:372px}
@media (max-width:700px){body.panel-open .buddy{display:none}.buddy .fig svg{width:64px;height:64px}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
.hop{animation:hop .5s ease!important}
@keyframes hop{0%,100%{transform:translateY(0)}40%{transform:translateY(-18px) scale(1.05)}}
.bpick.sel{border-color:var(--gold);box-shadow:0 0 0 3px var(--gold) inset}
.room{display:flex;gap:20px;flex-wrap:wrap;align-items:flex-start}
.roomfig{flex:0 0 220px;display:grid;place-items:center;background:radial-gradient(circle at 50% 70%,#fff6dc,#f3ead2);border-radius:20px;min-height:240px;position:relative}
.roombub{position:absolute;top:6px;left:50%;transform:translateX(-50%);background:#fff;border-radius:14px;padding:6px 12px;font-weight:700;white-space:nowrap;box-shadow:0 3px 0 rgba(0,0,0,.08)}
.roominfo{flex:1;min-width:260px}
.sbar{display:flex;align-items:center;gap:8px;margin:6px 0}.sbar>span{width:44px;font-weight:700}.sbar b{width:34px;text-align:right}
.sb{flex:1;height:14px;background:#efe6cf;border-radius:99px;overflow:hidden}.sb i{display:block;height:100%;border-radius:99px}
.actrow{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.foods{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px}
.food{background:#fff;border:2px solid var(--line);border-radius:14px;padding:8px;text-align:center}
/* level lobby */
.lvcard{padding:0;overflow:hidden}
.lvhead{color:#fff;padding:14px 18px;display:flex;gap:12px;align-items:center}.lvhead small{display:block;opacity:.9}.lvhead b{font-size:24px}
.tabs.big{padding:12px 16px 0;margin:0}.tabs.big .tog{font-size:18px;padding:10px 16px}
.lvbody{padding:12px 18px 20px}
.lvbody h3{margin:18px 0 8px}
.pts li{margin:6px 0;line-height:1.7}
.chars{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.ccard{background:#fff;border:2px solid var(--line);border-radius:16px;padding:12px}
.ctop{display:flex;align-items:center;gap:6px}
.cbig{font-size:54px;font-weight:700;line-height:1;font-family:"Noto Sans TC",serif}
.czy .zc.solo .b{font-size:20px;color:#2f4a66;min-height:60px}
.spk{margin-left:auto;border:none;background:#f3ead2;border-radius:10px;font-size:20px;padding:6px 10px}
.cmeta{display:flex;gap:12px;font-size:15px;color:var(--muted);margin:6px 0}
.cmeta b{color:var(--ink);font-size:17px}
.cwords{display:flex;gap:6px;flex-wrap:wrap;margin:4px 0}
.chip{display:inline-block;background:#fff6dc;border:1.5px solid #f0d58a;border-radius:10px;padding:2px 10px;font-weight:700}
.csent{font-size:16px;color:#3b4c5c;margin-top:4px;line-height:1.7}
body.zy .csent,body.zy .pts li,body.zy .tip,body.zy .clr>div>span,body.zy .pat li{line-height:2.3}
.zc .b{line-height:1!important}
.pat{background:#eef6ff;border-radius:14px;padding:10px 14px;margin:8px 0}
.tip{background:#fff2e5;border-left:6px solid #f3a64a;border-radius:10px;padding:10px 14px;margin:8px 0}
.clr{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}
@media (max-width:560px){.clr{grid-template-columns:1fr}}
.clr>div{border-radius:14px;padding:10px 14px;display:flex;flex-direction:column;gap:4px}
.cx{background:#fde9e8}.co{background:#e5f6ec}
/* games */
.mgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
@media (max-width:560px){.mgrid{grid-template-columns:repeat(3,1fr)}}
.mcard{height:96px;border:none;border-radius:14px;background:linear-gradient(135deg,#6fb3ff,#2f80c9);color:#fff;font-size:30px;font-weight:900;position:relative;box-shadow:0 3px 0 rgba(0,0,0,.15)}
.mcard .face{display:none;color:var(--ink);font-size:20px}
.mcard.open{background:#fff;border:3px solid var(--gold)}.mcard.open .back{display:none}.mcard.open .face{display:block}
.mcard.peek .back{display:none}.mcard.peek .face{display:block}.mcard.peek{background:#fff;border:3px solid #9fd6ef}
.mbar{display:flex;gap:10px;align-items:center;justify-content:center;margin:12px 0 0;flex-wrap:wrap}
.mcard.done{background:#e5f6ec;border-color:var(--good)}
.sortwrap{display:flex;flex-direction:column;align-items:center;gap:16px}
.sortitem{font-size:30px;font-weight:900;background:#fff;border:3px solid var(--gold);border-radius:18px;padding:16px 28px;min-width:160px;text-align:center}
.bins{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:100%}
.bin{border:3px dashed #c9bfa5;background:#fffaf0;border-radius:18px;padding:14px;min-height:150px;font-size:18px;color:var(--ink)}
.bin:hover{border-color:var(--sea-deep)}
.binin{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;justify-content:center}
.slots{display:flex;flex-direction:column;gap:8px;margin-bottom:14px}
.slot{display:flex;gap:10px;align-items:center;border:2px dashed #c9bfa5;border-radius:14px;padding:10px 12px;min-height:52px;font-size:19px;font-weight:700}
.slot.fill{border-style:solid;border-color:var(--good);background:#e5f6ec}
.sn{width:30px;height:30px;border-radius:50%;background:var(--gold);display:grid;place-items:center;font-weight:900;flex:none}
.slots.small .slot{min-height:40px;font-size:16px;padding:6px 10px}
.tiles{display:flex;flex-wrap:wrap;gap:8px}
.tile{border:2px solid var(--line);background:#fff;border-radius:14px;padding:10px 14px;font-size:18px;font-weight:700;color:var(--ink)}
.poparea{position:relative;height:340px;background:linear-gradient(180deg,#e6f6ff,#c8ebfb);border-radius:18px;overflow:hidden}
.bubble{position:absolute;width:18%;aspect-ratio:1;border-radius:50%;border:3px solid rgba(255,255,255,.9);background:radial-gradient(circle at 30% 30%,#fff,rgba(160,220,255,.75) 40%,rgba(120,190,240,.55));font-size:22px;font-weight:900;color:var(--ink);display:grid;place-items:center;animation:float 3s ease-in-out infinite;box-shadow:0 4px 10px rgba(0,0,0,.08)}
@media (max-width:560px){.bubble{font-size:15px}}
.bubble.popped{animation:popb .35s forwards}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
@keyframes popb{to{transform:scale(1.6);opacity:0}}
.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.cctl{display:flex;flex-direction:column;gap:8px;align-items:center}.cctl>div{display:flex;gap:6px;align-items:center}.cctl b{min-width:36px;text-align:center;font-size:22px}
.target{text-align:center;font-size:20px;margin-bottom:6px}
.quick{text-align:center}.qcount{color:var(--muted)}
.qstate{font-size:26px;font-weight:900;margin:18px 0;line-height:1.6}
.qbtns{display:flex;gap:20px;justify-content:center}
.qo{width:110px;height:110px;border-radius:50%;border:4px solid var(--good);background:#fff;font-size:60px;color:var(--good);font-weight:900}
.qo.x{border-color:var(--bad);color:var(--bad)}
/* exam */
.unitpick{display:flex;flex-wrap:wrap;gap:8px}
.chk{background:#fff;border:2px solid var(--line);border-radius:12px;padding:8px 12px;font-weight:700;cursor:pointer}
.paper{background:#fff;border-radius:6px;padding:22px;box-shadow:0 6px 0 rgba(31,51,71,.1);background-image:linear-gradient(#fff 0,#fff 100%)}
.phead{display:flex;justify-content:space-between;align-items:center;border-bottom:3px double #1f3347;padding-bottom:10px;margin-bottom:10px;gap:10px}
.score{width:92px;height:92px;border:3px solid #e23b2e;border-radius:50%;display:grid;place-items:center;color:#e23b2e;font-weight:900;font-size:36px;flex:none}
.score small{font-size:14px;color:#c98a8a}
.esec h3{border-left:6px solid var(--gold);padding-left:10px}
.eitem{padding:10px 6px;border-bottom:1px dashed #e0d6bd}
.eitem.ng{background:#fff6f5}.eitem.ok{background:#f6fcf8}
.eq{display:flex;gap:6px;font-size:20px;font-weight:700;line-height:1.6;align-items:flex-start}
body.zy .eq,body.zy .eopt,body.zy .eexp{line-height:2.3}
.eno{color:var(--muted)}
.mark{margin-left:auto;font-size:28px;font-weight:900}.ok .mark{color:var(--good)}.ng .mark{color:var(--bad)}
.eopts{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 0 26px}
.eopt{border:2px solid var(--line);background:#fff;border-radius:12px;padding:8px 14px;font-size:18px;font-weight:700;color:var(--ink)}
.eopt.sel{border-color:var(--sea-deep);background:#e8f4ff}
.eopt.right{border-color:var(--good);background:#e5f6ec}.eopt.wrong{border-color:var(--bad);background:#fde9e8}
.eopts.tf .eopt{font-size:26px;width:70px}
.enum{margin:8px 0 0 26px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.enum input{width:110px;font-size:22px;padding:6px 10px;border-radius:10px;border:2px solid var(--line);font-family:inherit}
.eans{color:var(--bad);font-weight:700}
.eexp{margin:8px 0 0 26px;background:#fff2e5;border-radius:10px;padding:8px 12px;font-size:16px}
.bigscore{font-size:72px;font-weight:900;color:#e23b2e}
.sech{border-left:6px solid var(--gold);padding-left:10px}
.arow{display:flex;gap:18px;flex-wrap:wrap;margin:6px 0 0 26px;font-size:17px}.okc{color:var(--good)}.ngc{color:var(--bad)}
#att.onlyw .eitem.ok{display:none}
.a4wrap{background:#8aa4b5;border-radius:16px;padding:18px;margin-top:14px;overflow:auto}
.a4{background:#fff;width:210mm;max-width:100%;min-height:297mm;margin:0 auto;padding:14mm 13mm;box-shadow:0 4px 18px rgba(0,0,0,.25)}
/* 2D map fallback */
.islands{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:18px}
.island{background:var(--card);border-radius:24px;overflow:hidden;box-shadow:0 6px 0 rgba(31,51,71,.12)}
.island-head{padding:14px 18px;color:#fff;display:flex;align-items:center;gap:10px}
.island-head .ic{font-size:32px}
.island-head b{font-size:24px;display:block}
.island-head span{font-size:14px;opacity:.95}
.levels{padding:8px 14px 16px;display:flex;flex-direction:column;gap:8px}
.lv{display:flex;align-items:center;gap:10px;background:#fff;border:2px solid var(--line);border-radius:14px;padding:10px 12px;text-align:left;font-size:17px;color:var(--ink)}
.lv:hover{border-color:var(--gold)}
.lv .num{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:900;flex:none}
.lv .t{flex:1;line-height:1.3}
.lv .t small{display:block;color:var(--muted);font-size:13px}
.stars{color:var(--gold);font-size:18px;letter-spacing:1px;white-space:nowrap}
.stars .off{color:#d8d0bd}
.extra{display:flex;gap:12px;flex-wrap:wrap;margin-top:18px}
.extra .card{flex:1;min-width:240px;display:flex;align-items:center;gap:14px}
.extra .card .big{font-size:42px}

/* quiz */
.qhead{display:flex;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.progress{flex:1;height:14px;background:rgba(255,255,255,.7);border-radius:99px;overflow:hidden;min-width:120px}
.progress i{display:block;height:100%;background:var(--gold);border-radius:99px;transition:width .3s}
.qtitle{font-size:15px;color:var(--muted);margin-bottom:6px}
.qtext{font-size:26px;font-weight:700;line-height:1.5;margin:6px 0 14px}
.passage{background:#fff6dc;border-left:6px solid var(--gold);padding:12px 14px;border-radius:10px;font-size:20px;line-height:1.8;margin-bottom:10px}
.visual{display:flex;justify-content:center;margin:6px 0 14px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:560px){.opts{grid-template-columns:1fr}.qtext{font-size:22px}}
.opt{border:3px solid var(--line);background:#fff;border-radius:16px;padding:16px;font-size:22px;font-weight:700;text-align:left;min-height:64px;color:var(--ink)}
.opt:hover:not(:disabled){border-color:var(--sea-deep)}
.opt{display:flex;align-items:center;gap:12px}
.onum{flex:none;width:36px;height:36px;border-radius:50%;background:#eef3f8;color:#2f4a66;display:grid;place-items:center;font-size:18px;font-weight:900}
.opt.right .onum{background:var(--good);color:#fff}.opt.wrong .onum{background:var(--bad);color:#fff}
.eopt .onum{width:26px;height:26px;font-size:14px;display:inline-grid;margin-right:6px;vertical-align:middle}
.opt.right{border-color:var(--good);background:#e5f6ec}
.opt.wrong{border-color:var(--bad);background:#fde9e8}
.opt:disabled{cursor:default}
.feedback{margin-top:14px;border-radius:16px;padding:16px;font-size:19px;line-height:1.7}
.feedback.good{background:#e5f6ec;border:2px solid #b8e2c8}

<div id="gate"><div class="gbox">
  <h1>🏝️ 島嶼探險隊</h1><p>請登入你的帳號</p>
  <form id="gform" autocomplete="on">
    <input id="guser" placeholder="帳號" autocomplete="username" autocapitalize="off" required>
    <input id="gpass" type="password" placeholder="密碼" autocomplete="current-password" required>
    <button id="gbtn" type="submit">登入</button>
  </form>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import {getAuth,signInWithEmailAndPassword,onAuthStateChanged,signOut,setPersistence,browserLocalPersistence} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import {getFirestore,doc,getDoc,setDoc,collection,getDocs,serverTimestamp} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

const firebaseConfig={"apiKey": "AIzaSyBhpd4pDiVT9suLCvP4ys35qReI8OlaJQ4", "authDomain": "tangba-123.firebaseapp.com", "projectId": "tangba-123", "storageBucket": "tangba-123.firebasestorage.app", "messagingSenderId": "256828390653", "appId": "1:256828390653:web:fc76cddb05db53f4ccd294"};
const PARENT_UIDS=["9EQCZLh8l2eISIrzAP1C7cViqXi2"];      // 家長帳號（可以看全部人的紀錄）
const DOMAIN="@family.app";              // 帳號沒打 @ 時自動補上
const STORES=[["islandExplorer.v1", "data", "islandExplorer.owner"],["tt99g10", "data_tt99g10", "tt99g10.owner"],["tt99game", "data_tt99game", "tt99game.owner"],["tt99", "data_tt99", "tt99.owner"]];   // [這頁的瀏覽器資料名稱, 雲端欄位, 主人標記]
const WATCH=new Set(STORES.map(s=>s[0]));

const app=initializeApp(firebaseConfig), auth=getAuth(app), db=getFirestore(app);
setPersistence(auth,browserLocalPersistence).catch(()=>{});
const $=id=>document.getElementById(id);
const rawSet=localStorage.setItem.bind(localStorage);
let user=null, started=false, upT=null, dirty=false;

const ERR={"auth/invalid-credential":"帳號或密碼不對，再試一次","auth/wrong-password":"帳號或密碼不對，再試一次","auth/user-not-found":"沒有這個帳號","auth/invalid-email":"帳號格式不對","auth/user-disabled":"這個帳號已經停用，請找家長","auth/too-many-requests":"試太多次了，請等一下再試","auth/network-request-failed":"網路連不上，請檢查網路"};
$("gform").addEventListener("submit",async e=>{
  e.preventDefault(); $("gerr").textContent=""; $("gbtn").disabled=true;
  let u=$("guser").value.trim().toLowerCase(); if(!u.includes("@")) u+=DOMAIN;
  try{ await signInWithEmailAndPassword(auth,u,$("gpass").value); }
  catch(err){ $("gerr").textContent=ERR[err.code]||("登入失敗："+(err.code||err.message)); $("gbtn").disabled=false; }
});

async function upload(){
  if(!user||!dirty) return; dirty=false;
  const o={email:user.email,updatedAt:serverTimestamp()}; STORES.forEach(([k,f])=>{o[f]=localStorage.getItem(k)||""});
  try{ await setDoc(doc(db,"users",user.uid),o,{merge:true}); setStat("☁️ 已同步"); }
  catch(e){ dirty=true; setStat("⚠️ 尚未同步"); }
}
function queue(){ dirty=true; setStat("☁️ 同步中…"); clearTimeout(upT); upT=setTimeout(upload,2500); }
document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="hidden"){clearTimeout(upT);upload();} });
window.addEventListener("pagehide",()=>{clearTimeout(upT);upload();});
function setStat(s){const el=$("acstat");if(el)el.textContent=s;}

onAuthStateChanged(auth,async u=>{
  if(!u){ if(started){ location.reload(); } $("gate").style.display="flex"; $("gbtn").disabled=false; return; }
  user=u; $("gate").querySelector("p").textContent="載入你的紀錄中…";
  let d={}, ok=true;
  try{ const snap=await getDoc(doc(db,"users",u.uid)); d=snap.exists()?snap.data():{}; }catch(e){ ok=false; }
  STORES.forEach(([k,f,ow])=>{
    const owner=localStorage.getItem(ow), remote=d[f]||"";
    if(!ok){ if(owner!==u.uid) localStorage.removeItem(k); }        // 離線時只用自己的紀錄
    else if(remote){ rawSet(k,remote); }
    else if(owner&&owner!==u.uid){ localStorage.removeItem(k); }    // 別人的紀錄不要帶過來
    else if(!owner&&localStorage.getItem(k)){ dirty=true; }         // 第一次登入：把這台裝置原本的紀錄搬上去
    rawSet(ow,u.uid);
  });
  start(u);
  if(dirty) upload();
});

function start(u){
  if(started) return; started=true;
  localStorage.setItem=function(k,v){ rawSet(k,v); if(WATCH.has(k)) queue(); };
  const rawRm=localStorage.removeItem.bind(localStorage); localStorage.removeItem=function(k){ rawRm(k); if(WATCH.has(k)) queue(); };
  $("gate").style.display="none";
  const name=(u.email||"").replace(DOMAIN,"");
  const bar=document.createElement("div"); bar.id="acct";
  bar.innerHTML=`<span>👤 ${name.replace(/[<>&]/g,"")}</span><span id="acstat">☁️ 已同步</span>${PARENT_UIDS.includes(u.uid)?'<button id="acall">👨‍👩‍👧 全部帳號</button>':""}<button id="acout">登出</button>`;
  document.body.appendChild(bar);
  $("acout").onclick=async()=>{ clearTimeout(upT); await upload(); [["islandExplorer.v1","","islandExplorer.owner"],["tt99game","","tt99game.owner"],["tt99","","tt99.owner"],["tt99g10","","tt99g10.owner"]].forEach(([k,,ow])=>{localStorage.removeItem(k);localStorage.removeItem(ow)}); await signOut(auth); };

async function showAll(){

  document.body.appendChild(box); box.querySelector(".x").onclick=()=>box.remove();
  try{
    const qs=await getDocs(collection(db,"users")); const rows=[];
    qs.forEach(d=>{ const v=d.data(); let m={}; try{m=JSON.parse(v.data||"{}")}catch(e){}
      const other=[["data_tt99game","數學大冒險"],["data_tt99","乘法遊樂園"],["data_tt99g10","乘法遊戲島"]].filter(([f])=>v[f]).map(([,n])=>n).join("、")||"—";
      const profs=Object.values(m.profiles||{});
      const when=v.updatedAt&&v.updatedAt.toDate?v.updatedAt.toDate().toLocaleString("zh-TW"):"—";
      if(!profs.length) rows.push(`<tr><td>${(v.email||"").replace(DOMAIN,"")}</td><td>—</td><td></td><td></td><td></td><td></td><td>${other}</td><td>${when}</td></tr>`);

    });
    box.querySelector("#aload").outerHTML=`<table><tr><th>帳號</th><th>隊員</th><th>貝殼</th><th>闖過</th><th>錯題</th><th>英文島</th><th>其他遊戲</th><th>最後同步</th></tr>${rows.join("")}</table><p style="font-size:13px;color:#888">新增、停用帳號或重設密碼，請到 Firebase 主控台 → Authentication → 使用者。</p>`;
  }catch(e){ box.querySelector("#aload").textContent="讀不到（請確認資料庫規則裡有你的家長 UID）："+(e.code||e.message); }
}

  {q:"「暖」的部首是什麼？", o:["日","火","月","爪"], e:"「暖」左邊是日，部首是日部。太陽照著就會暖暖的。"},

 id:"math", name:"數學島", book:"南一 2上", color:"#2f80c9", icon:"🔢",
 levels:[

  {q:"媽媽有 80 元，買麵包花 35 元，買牛奶花 20 元。還剩幾元？", o:["25 元","45 元","60 元","35 元"], e:"花錢要用減的：80 − 35 = 45，45 − 20 = 25。可以寫成 80 − 35 − 20 = 25。"},
  {q:"盒子裡有 40 顆糖，吃掉 15 顆，又放進 23 顆。現在有幾顆？", o:["48 顆","32 顆","78 顆","2 顆"], e:"吃掉用減：40 − 15 = 25；放進用加：25 + 23 = 48。"},
  {q:"「小明有 32 張貼紙，送給妹妹 9 張，哥哥又給他 14 張。」哪一個算式是對的？", o:["32 − 9 + 14","32 + 9 − 14","32 − 9 − 14","32 + 9 + 14"], e:"送出去的會變少（減 9），別人給的會變多（加 14），所以是 32 − 9 + 14。"},

 {id:"m7", unit:"第7單元", title:"2、5、4、8 的乘法", qs:[

  {q:"8 × 3 = ？", o:["24","11","32","21"], e:"口訣「三八二十四」，8 × 3 = 24。"},
  {q:"一隻章魚有 8 隻腳，5 隻章魚共有幾隻腳？", o:["40 隻","13 隻","45 隻","48 隻"], e:"8 的 5 倍：8 × 5 = 40（口訣「五八四十」）。"},
  {q:"5 × 9 = ？", o:["45","14","40","54"], e:"口訣「五九四十五」，5 × 9 = 45。"},

  {q:"口訣「二八十六」代表哪一個算式？", o:["2 × 8 = 16","2 + 8 = 16","28 = 16","8 × 8 = 16"], e:"「二八十六」是乘法口訣，意思是 2 × 8 = 16。2 + 8 只有 10 喔。"},

 {id:"m8", unit:"第8單元", title:"幾時幾分", qs:[
  {clock:[3,15], q:"鐘面上是幾時幾分？", o:["3 時 15 分","3 時 3 分","15 時 3 分","4 時 15 分"], e:"短針（時針）在 3 和 4 中間，是 3 時；長針指著 3，3 大格 = 15 分。所以是 3 時 15 分。"},
  {clock:[7,40], q:"鐘面上是幾時幾分？", o:["7 時 40 分","8 時 40 分","7 時 8 分","8 時 20 分"], e:"短針過了 7、還沒到 8，是 7 時；長針指著 8，8 大格 × 5 = 40 分。"},
  {q:"長針從 12 走到 6，走了幾分鐘？", o:["30 分鐘","6 分鐘","60 分鐘","12 分鐘"], e:"從 12 到 6 是 6 大格，每大格 5 分鐘，6 × 5 = 30 分鐘。"},
  {q:"鐘面上的長針走一大格，是幾分鐘？", o:["5 分鐘","1 分鐘","10 分鐘","60 分鐘"], e:"一大格裡有 5 小格，每小格 1 分鐘，所以一大格是 5 分鐘。"},
  {clock:[9,5], q:"鐘面上是幾時幾分？", o:["9 時 5 分","9 時 1 分","1 時 45 分","10 時 5 分"], e:"短針剛過 9，是 9 時；長針指著 1，1 大格 = 5 分。"},
  {clock:[10,50], q:"鐘面上是幾時幾分？（小心短針喔！）", o:["10 時 50 分","11 時 50 分","10 時 10 分","11 時 10 分"], e:"短針很靠近 11，但還沒走到 11，所以還是 10 時；長針指著 10，10 × 5 = 50 分。"},
  {q:"小美 8 時 10 分出門，8 時 35 分到學校。她走了幾分鐘？", o:["25 分鐘","35 分鐘","45 分鐘","15 分鐘"], e:"都是 8 時，只要看分鐘：35 − 10 = 25 分鐘。"},
  {clock:[2,27], q:"鐘面上是幾時幾分？", o:["2 時 27 分","2 時 25 分","5 時 27 分","2 時 30 分"], e:"短針在 2 和 3 中間，是 2 時；長針過了 5（25 分）再多 2 小格，25 + 2 = 27 分。"}
 ]},

  {q:"正方形有幾條邊？", o:["4 條","3 條","5 條","6 條"], e:"正方形有 4 條邊、4 個角、4 個頂點。"},
  {shape:"tri", q:"三角形有幾個頂點？", o:["3 個","4 個","2 個","6 個"], e:"三角形有 3 條邊，邊和邊相交的地方就是頂點，共 3 個。"},
  {q:"正方形的 4 條邊，長度是怎樣？", o:["4 條都一樣長","只有 2 條一樣長","都不一樣長","上下比較長"], e:"正方形的 4 條邊都一樣長。"},

  {q:"【延伸】正方形每條邊長 4 公分，周長是幾公分？", o:["16 公分","8 公分","12 公分","4 公分"], e:"正方形 4 條邊一樣長：4 + 4 + 4 + 4 = 16 公分（4 × 4）。"},
  {shape:"rect63", q:"【延伸】長方形長 6 公分、寬 3 公分，周長是幾公分？", o:["18 公分","9 公分","12 公分","24 公分"], e:"周長是一圈的長度：6 + 3 + 6 + 3 = 18 公分。"},

 id:"life", name:"生活島", book:"翰林 2上", color:"#3a9d5d", icon:"🌱",

 {id:"l3", unit:"第3單元", title:"玩泡泡", qs:[
  {q:"自己做泡泡水，可以用什麼？", o:["水加洗碗精或肥皂","水加鹽","水加糖","只有清水"], e:"清潔劑（洗碗精、肥皂）加水，才吹得出泡泡。只有清水或加鹽、加糖都吹不出來。"},
  {q:"想吹出大泡泡，要怎麼吹？", o:["慢慢的、輕輕的吹","很用力很快的吹","對著地上吹","邊跑邊大口吹"], e:"慢慢、輕輕的吹，泡泡才有時間變大；太用力泡泡會破掉，或變成很多小泡泡。"},
  {q:"想一次吹出很多小泡泡，可以怎麼做？", o:["用有很多小洞的工具，用力一點吹","用一根粗吸管慢慢吹","不沾泡泡水就吹","把泡泡水加熱"], e:"有很多小洞的工具（例如網子），每個洞都能吹出泡泡，稍微用力就會一次出現很多。"},
  {q:"在陽光下仔細看泡泡，表面會看到什麼？", o:["像彩虹一樣的顏色","黑色的斑點","文字","什麼都沒有"], e:"泡泡的表面在光線照射下，會出現彩虹般的顏色，而且一直在變化。"},
  {q:"泡泡水不小心噴進眼睛，應該怎麼辦？", o:["馬上用清水沖洗，並告訴大人","用手用力揉","不用管它","再噴一次"], e:"泡泡水有清潔劑，會刺激眼睛。要馬上用清水沖，並告訴老師或家人，不要揉眼睛。"},
  {q:"吹泡泡時，哪一個是安全的做法？", o:["不要對著別人的臉吹","把泡泡水喝下去","在樓梯上跑著吹","把泡泡水倒在走廊"], e:"泡泡不要對著別人的臉吹；泡泡水不能喝；地上濕濕的會滑倒，要小心。"},
  {q:"用剩的泡泡水，可以拿來做什麼？", o:["清潔東西，例如擦桌子","倒在地上玩溜冰","給小動物喝","丟進魚缸"], e:"泡泡水裡有清潔劑，可以拿來洗東西、打掃，不要浪費，也不能給動物喝。"},
  {q:"用肥皂搓手時出現泡泡，有什麼用處？", o:["幫忙把手上的髒東西帶走","讓手變香而已","讓手變冷","沒有用處"], e:"肥皂的泡泡能把手上的髒東西包起來，用水一沖就帶走了，手就乾淨了。"}
 ]},
 {id:"l4", unit:"第4單元", title:"學校附近的環境", qs:[
  {q:"想認識學校附近，可以用哪些方法？", o:["以上都可以","實際走走看","問家人或老師","看地圖"], e:"走走看、問人、看地圖都是認識學校附近的好方法，可以一起使用。"},
  {q:"去拜訪學校附近的商店時，怎麼做最有禮貌？", o:["先打招呼、說明來意，結束時說謝謝","直接跑進去拿東西看","大聲吵鬧","不說話就離開"], e:"見面先問好、說明為什麼來，離開時說謝謝，對方會很樂意幫助我們。"},
  {q:"跟老師到校外參觀時，要注意什麼？", o:["跟著隊伍，聽老師的指示","自己跑去喜歡的地方","走在馬路中間","跟陌生人走"], e:"校外人車多，要跟緊隊伍、聽老師的話，不可以自己亂跑。"},
  {q:"過馬路時，要怎麼做？", o:["走斑馬線，看清楚紅綠燈","從車子中間跑過去","邊看手機邊走","閉著眼睛走"], e:"要走斑馬線，綠燈時左右看清楚再過，才安全。"},
  {q:"生病了，應該去哪一個「學校好鄰居」？", o:["診所","麵包店","書店","公園"], e:"診所有醫生可以幫我們看病。"},
  {q:"想知道消防隊在做什麼，最適合問誰？", o:["消防員","賣菜的老闆","郵差","同學的弟弟"], e:"消防員最了解消防隊的工作，可以問他們救火、救人的事。"},
  {q:"把拜訪時的發現記下來，可以用什麼方法？", o:["以上都可以","畫圖","拍照","寫下來"], e:"畫圖、拍照、寫字都能把發現記錄下來，回教室再和同學分享。"},
  {q:"同學上台分享他的發現時，我應該怎麼做？", o:["專心聽，然後給他回饋","和旁邊的人聊天","趴著睡覺","一直插嘴"], e:"專心聆聽是尊重別人；聽完可以說說喜歡哪裡，或提出好問題。"}
 ]},
 {id:"l5", unit:"第5單元", title:"美麗色彩", qs:[
  {q:"紅綠燈亮紅燈時，代表什麼？", o:["停下來","可以走","快點跑","按喇叭"], e:"紅色常用來提醒「停止、危險」，看到紅燈要停下來等。"},
  {q:"同一片葉子，可能有好幾種顏色嗎？", o:["可能，例如綠色裡帶一點黃色","不可能，只有一種顏色","葉子都是白色的","只有花才有顏色"], e:"仔細觀察，一片葉子常有深綠、淺綠，甚至黃色、紅色，顏色很豐富。"},
  {q:"下面哪一組都是藍色的家族（同類色）？", o:["天藍、深藍、淺藍","紅色、黃色、綠色","黑色、白色、紅色","橘色、紫色、綠色"], e:"天藍、深藍、淺藍都是藍色，只是深淺不同，屬於同一類顏色。"},
  {q:"紅色和黃色的顏料混在一起，會變成什麼顏色？", o:["橙色（橘色）","紫色","綠色","藍色"], e:"紅 + 黃 = 橙色（也就是橘色）。課本說「橙色」。"},
  {q:"藍色和黃色的顏料混在一起，會變成什麼顏色？", o:["綠色","橘色","紫色","咖啡色"], e:"藍 + 黃 = 綠色。"},
  {q:"在顏料裡加一點白色，顏色會變得怎樣？", o:["比較淺","比較深","變成黑色","沒有改變"], e:"加白色會讓顏色變淺、變柔和；加黑色才會變深。"},
  {q:"看到紅色、橙色，通常會讓人覺得怎樣？", o:["溫暖、熱鬧","冰冷","很想睡覺","安靜涼爽"], e:"紅色、橙色像太陽和火，讓人覺得溫暖熱鬧；藍色、綠色比較讓人覺得涼爽安靜。"},
  {q:"大家一起用色彩布置教室時，要怎麼做？", o:["一起商量、分工合作","每個人只做自己的，不管別人","搶最好看的顏色","讓一個人全部做"], e:"先討論想要的感覺和顏色，再分工合作，教室會布置得又漂亮又整齊。"}
 ]},
 {id:"l6", unit:"第6單元", title:"溫暖來過冬", qs:[
  {q:"冬天的天氣，通常是怎樣？", o:["比較冷","非常熱","每天都有颱風","和夏天一樣"], e:"冬天氣溫比較低，有時還有寒流，天氣很冷。"},
  {q:"冬天出門，可以怎麼保暖？", o:["穿外套、戴帽子和圍巾","穿短袖短褲","吃冰淇淋","把頭髮弄濕"], e:"外套、帽子、圍巾、手套都可以幫身體保暖。"},
  {q:"「洋蔥式穿衣法」是什麼意思？", o:["多穿幾件薄衣服，熱了可以脫一件","只穿一件很厚的衣服","把洋蔥放在口袋","衣服反過來穿"], e:"像洋蔥一層一層，穿好幾件薄的；覺得熱就脫一件，冷了再穿上，很方便。"},
  {q:"冬天天氣冷，還需要喝水嗎？", o:["需要，可以喝溫開水","不需要喝水","只喝冰水","只喝汽水"], e:"冬天身體一樣需要水分，喝溫開水身體會暖暖的。"},
  {q:"冬天在浴室使用瓦斯熱水器洗澡，要注意什麼？", o:["窗戶要打開，保持通風","把門窗全部關緊","在浴室裡玩火","洗很久都不出來"], e:"瓦斯熱水器要保持通風，否則可能發生一氧化碳中毒，非常危險。"},

const ACCENTS=["#e8554e","#2e8b57","#f08a3c","#5b4b9a","#2350a8","#f2a51f","#1f8a7a","#c2417a"];
const SHAPES=ENG_SHAPES;
const ICON={dad:"👨‍👧",mom:"👩‍👧",write:"✍️",cook:"🧑‍🍳",fence:"#s:fence",mop:"#s:mop",cube:"#s:cube",tape:"#s:tape",sub:"#s:sub"};
const ABSTRACT=ENG_ABSTRACT, EXT=ENG_EXT;
// 圖示比較勉強、建議家長看看要不要換的字
const FLAG=["flea","plum","spot","card","pretty","warm","cool","scruff","sniff","staff","tray","drag","flat","blunt","by","spline","scud","glean","bog","cot","eve","lede","sprain","strain","trope","plot","prop","pride","treat","bruit","dab","cad","fen","jib"];

/* ---------- 工具 ---------- */
const $=id=>R.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const lenCls=w=>w.length>=11?"xxlong":w.length>=9?"xlong":w.length>=7?"long":"";
const pad=n=>String(n).padStart(2,"0");
const dstr=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const today=()=>dstr(new Date());
const addDays=(n)=>{const d=new Date();d.setDate(d.getDate()+n);return dstr(d)};
const md=s=>{const [,m,d]=s.split("-");return `${+m}/${+d}`};
const lw=s=>s.toLowerCase();

/* ---------- 資料存取 ---------- */
const DEF={st:{book:BOOKS[0].id,mode:"pic",acc:"en-US",slow:false,zy:true,ext:false},voice:{},learned:{},wb:{},stats:{days:{},words:{}},icons:{},grad:{}};
let E=HOST.store.get();
if(!E||typeof E!=="object") E={};
for(const k of Object.keys(DEF)) if(E[k]==null) E[k]=JSON.parse(JSON.stringify(DEF[k]));
E.st=Object.assign({},DEF.st,E.st); E.stats.days=E.stats.days||{}; E.stats.words=E.stats.words||{};
let saveT=null; function save(){clearTimeout(saveT); saveT=setTimeout(()=>HOST.store.set(E),150);}
function saveNow(){clearTimeout(saveT); HOST.store.set(E);}

const S={view:"cards",group:"all",custom:null};
Object.defineProperty(S,"book",{get:()=>E.st.book,set:v=>{E.st.book=v}});
if(!BOOKS.find(b=>b.id===S.book)) S.book=BOOKS[0].id;
try{const qp=new URLSearchParams(location.search); if(!HOST.embedded){ if(qp.get("mode"))E.st.mode=qp.get("mode"); if(qp.get("book")&&BOOKS.find(b=>b.id===qp.get("book")))S.book=qp.get("book"); if(qp.get("view"))S.view=qp.get("view"); }}catch(e){}

const book=()=>BOOKS.find(b=>b.id===S.book)||BOOKS[0];
const isAC=()=>S.book.startsWith("AC");
function iconFor(w,p){const k=lw(w);return E.icons[k]||ICON[k]||p}
function mk(it,gi,title){let [w,zh,p,letter]=it.split("|");return {w,zh,p:iconFor(w,p),letter,gi,title}}
function items(all,b){b=b||book();const out=[];
  b.groups.forEach((g,gi)=>{ if(!all && S.group!=="all" && +S.group!==gi) return; const [title,...rest]=g; rest.forEach(it=>out.push(mk(it,gi,title))); });
  return out;}
function findWord(w){w=lw(w);for(const b of BOOKS)for(const [gi,g] of b.groups.entries())for(const it of g.slice(1)){if(lw(it.split("|")[0])===w)return mk(it,gi,g[0])}return null}
const isAbs=x=>ABSTRACT.has(lw(x.w))||x.zh.includes("人名");
const isExt=x=>EXT.has(lw(x.w));
function picHTML(p){
  if(!p) return "";
  if(p.startsWith("img:")) return `<img class="uimg" src="${p.slice(4)}" alt="">`;
  if(p.startsWith("#c:")) return `<div class="swatch" style="background:${p.slice(3)}"></div>`;
  if(p.startsWith("#n:")) return `<div class="num">${p.slice(3)}</div>`;
  if(p.startsWith("#s:")) return `<svg viewBox="0 0 100 100">${SHAPES[p.slice(3)]||""}</svg>`;
  return `<span class="emo">${esc(p)}</span>`;
}
function zhBig(zh){const n=zh.length;return `<div class="zhbig ${n>5?"s3":n>3?"s2":""}">${esc(zh)}</div>`}
function promptPic(q,withZh){return isAbs(q)?(withZh?`<div class="gpic sm">${picHTML(q.p)}</div>`:"")+zhBig(q.zh):`<div class="gpic">${picHTML(q.p)}</div>`+(withZh?`<div class="gzh">${esc(q.zh)}</div>`:"")}
function toast(msg){const t=document.createElement("div");t.className="etoast";t.textContent=msg;$("engroot").appendChild(t);setTimeout(()=>t.remove(),2200)}
function topScroll(){try{$("engroot").scrollIntoView({block:"start"})}catch(e){}}

/* ---------- 語音 ---------- */
let voices=[];
function loadVoices(){try{voices=speechSynthesis.getVoices()||[]}catch(e){voices=[]} voiceNote();}
try{speechSynthesis.addEventListener("voiceschanged",loadVoices)}catch(e){}
const norm=v=>(v.lang||"").replace("_","-").toLowerCase();
function pickVoice(lang){
  const want=E.voice[lang]; if(want){const v=voices.find(x=>x.name===want); if(v) return v;}
  const c=voices.filter(v=>norm(v).startsWith(lw(lang)));
  if(!c.length) return null;
  for(const r of [/natural|online/i,/enhanced|premium|加強|高品質/i,/google/i,/samantha|ava|allison|aaron|nicky|daniel|serena|arthur|martha|kate|stephanie/i]){const f=c.find(v=>r.test(v.name)); if(f) return f;}
  return c.find(v=>v.localService)||c[0];
}
function voiceNote(){
  const v=pickVoice(E.st.acc), el=$("voiceNote"); if(!el) return;
  if(!voices.length){el.textContent="";return}
  el.textContent = v ? `　語音：${v.name}` : `　這台裝置沒有${E.st.acc==="en-GB"?"英式":"美式"}語音，會改用預設英文語音（可到「家長」頁看怎麼下載）。`;
}
function speak(text){
  try{ speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(text);
    const v=pickVoice(E.st.acc); u.lang=E.st.acc; if(v) u.voice=v; const er=E.st.erate||0.95; u.rate=E.st.slow?Math.max(0.4,er*0.6):er; u.pitch=E.st.epitch||1; speechSynthesis.speak(u);}catch(e){}
}

/* ---------- 英文語音設定面板 ---------- */
const EV_LANG={"en-us":"美國","en-gb":"英國","en-au":"澳洲","en-ca":"加拿大","en-in":"印度","en-ie":"愛爾蘭","en-nz":"紐西蘭","en-za":"南非","en-sg":"新加坡","en-hk":"香港","en-ph":"菲律賓"};
const evGood=v=>/natural|online|enhanced|premium|加強|高品質|google/i.test(v.name);
function evScore(v){let s=0;const l=norm(v);if(l.startsWith(lw(E.st.acc)))s+=100;if(/natural|online/i.test(v.name))s+=30;if(/enhanced|premium|加強|高品質/i.test(v.name))s+=25;if(/google/i.test(v.name))s+=20;if(/novelty|bells|bubbles|cellos|whisper|zarvox|trinoids|organ|bad news|good news|jester|superstar|wobble|boing|albert|bahh|deranged|hysterical/i.test(v.name))s-=200;return s}
const EV_SAMPLE=["Hello! Nice to meet you.","I like red apples.","Let's read together!","The cat is on the mat."];
let evI=0;
function evTest(name){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(EV_SAMPLE[evI++%EV_SAMPLE.length]);let v=name?voices.find(x=>x.name===name):pickVoice(E.st.acc);u.lang=v?v.lang:E.st.acc;if(v)u.voice=v;u.rate=E.st.erate||0.95;u.pitch=E.st.epitch||1;speechSynthesis.speak(u)}catch(e){}}
const evR=id=>{const H=document.getElementById("evHost");return H?H.shadowRoot.getElementById(id):null};
function evClose(){const H=document.getElementById("evHost");if(H)H.remove();if(S.view==="parent")renderParent()}
function evOpen(){
  loadVoices();
  let H=document.getElementById("evHost");
  if(!H){H=document.createElement("div");H.id="evHost";document.body.appendChild(H);const sh=H.attachShadow({mode:"open"});
    sh.innerHTML=`<style>${ENG_CSS}</style><div id="engroot" style="background:none;min-height:0"><div id="evOv" class="evov"></div></div>`;
    const ov=sh.getElementById("evOv");ov.addEventListener("click",evClick);ov.addEventListener("input",evInput);}
  const o=H.shadowRoot.getElementById("evOv");
  const env=voices.filter(v=>norm(v).startsWith("en")&&evScore(v)>-50).sort((a,b)=>evScore(b)-evScore(a));
  const cur=pickVoice(E.st.acc), want=E.voice[E.st.acc]||"";
  const er=E.st.erate||0.95, ep=E.st.epitch||1;
  const row=v=>{const l=norm(v).slice(0,5);return `<div class="evrow ${want===v.name?"on":""}"><div class="nm" data-evpick="${esc(v.name)}">${want===v.name?"✅ ":""}${esc(v.name.replace(/^Microsoft /,"").replace(/ - English.*$/,"").replace(/ Online \(Natural\)/," Natural"))}${evGood(v)?'<span class="evtag">推薦</span>':""}<small>${EV_LANG[l]||esc(v.lang)}口音${v.localService?"":"・需要網路"}</small></div><button data-evtry="${esc(v.name)}">▶</button></div>`};
  o.innerHTML=`<div class="evp">
   <h3><span>🗣️ 英文發音設定</span><button class="evx" data-evact="close">✕</button></h3>
   <h4>口音</h4>
   <div class="seg" id="evAcc"><button data-evacc="en-US" class="${E.st.acc==="en-US"?"on":""}">🇺🇸 美式</button><button data-evacc="en-GB" class="${E.st.acc==="en-GB"?"on":""}">🇬🇧 英式</button></div>
   <h4>聲音（點名字選擇，▶ 先試聽）</h4>
   <div class="evlist">
     <div class="evrow ${want?"":"on"}"><div class="nm" data-evpick="">${want?"":"✅ "}🎲 自動挑選<small>現在會用：${cur?esc(cur.name):"裝置預設英文語音"}</small></div><button data-evtry="">▶</button></div>
     ${env.length?env.map(row).join(""):'<p class="evnote">這台裝置還沒有英文語音，請到「📊 家長」頁看怎麼下載。</p>'}
   </div>
   <h4>速度與音高</h4>
   <div class="evsl"><label>速度</label><input type="range" id="evRate" min="0.5" max="1.3" step="0.05" value="${er}"><b id="evRateV">${er.toFixed(2)}</b></div>
   <div class="evsl"><label>音高</label><input type="range" id="evPitch" min="0.6" max="1.6" step="0.05" value="${ep}"><b id="evPitchV">${ep.toFixed(2)}</b></div>
   <div class="evbar"><button data-evact="test">▶ 試聽一句</button><button class="w" data-evact="reset">↺ 恢復預設</button><button class="w" data-evact="close">完成</button></div>
   <p class="evnote">「🐢 放慢」會在這個速度上再放慢。標「推薦」的聲音通常比較自然；標「需要網路」的要連上網路才會念。中文的聲音跟島嶼探險隊的語音設定共用。</p>
  </div>`;
}
function evClick(e){
  const t=e.target;
  if(t.id==="evOv"){evClose();return}
  const b=t.closest("[data-evpick],[data-evtry],[data-evacc],[data-evact]"); if(!b)return;
  if(b.dataset.evpick!==undefined){E.voice[E.st.acc]=b.dataset.evpick;save();voiceNote();evTest(b.dataset.evpick);evOpen();return}
  if(b.dataset.evtry!==undefined){evTest(b.dataset.evtry);return}
  if(b.dataset.evacc){E.st.acc=b.dataset.evacc;save();syncSeg("accSeg","acc",E.st.acc);voiceNote();evTest("");evOpen();return}
  const a=b.dataset.evact;
  if(a==="close")evClose();
  else if(a==="test")evTest("");
  else if(a==="reset"){delete E.st.erate;delete E.st.epitch;E.voice[E.st.acc]="";save();voiceNote();evOpen();evTest("")}
}
function evInput(e){
  if(e.target.id==="evRate"){E.st.erate=+e.target.value;evR("evRateV").textContent=E.st.erate.toFixed(2);save()}
  if(e.target.id==="evPitch"){E.st.epitch=+e.target.value;evR("evPitchV").textContent=E.st.epitch.toFixed(2);save()}
  clearTimeout(evInput.t);evInput.t=setTimeout(()=>evTest(""),350);
}
function zhPref(){try{return JSON.parse(localStorage.getItem("ttVoice")||"{}")||{}}catch(e){return {}}}
function zhVoice(){const n=zhPref().voice;if(n){const f=voices.find(x=>x.name===n);if(f)return f}const v=voices.filter(v=>/zh[-_]TW/i.test(v.lang));return v.find(x=>/google/i.test(x.name))||v[0]||voices.find(x=>/^zh/i.test(x.lang))||null}
function speakZh(text){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);const v=zhVoice();u.lang="zh-TW";if(v)u.voice=v;const zp=zhPref();u.rate=(zp.rate||0.9)*(E.st.slow?0.8:1);u.pitch=zp.pitch||1.1;speechSynthesis.speak(u)}catch(e){}}
let AC=null;
function sfx(ok){
  try{ AC=AC||new (window.AudioContext||window.webkitAudioContext)();
    const t=AC.currentTime, notes=ok?[660,990]:[240,190];
    notes.forEach((f,i)=>{const o=AC.createOscillator(),g=AC.createGain();o.type=ok?"triangle":"sawtooth";o.frequency.value=f;
      const s=t+i*.12;g.gain.setValueAtTime(.0001,s);g.gain.exponentialRampToValueAtTime(ok?.22:.06,s+.02);g.gain.exponentialRampToValueAtTime(.0001,s+.2);
      o.connect(g);g.connect(AC.destination);o.start(s);o.stop(s+.22);});
  }catch(e){}
}

/* ---------- 學習紀錄、錯題本（間隔複習） ---------- */
const BOXDAYS=[1,3,7];   // 答對一次後隔 1 天、再隔 3 天、再隔 7 天；連續 3 次答對就畢業
function dayRec(){const d=today();return E.stats.days[d]=E.stats.days[d]||{n:0,ok:0}}
function record(q,ok){
  const d=dayRec(); d.n++; if(ok)d.ok++;
  if(q&&q.w){
    const k=S.book+"|"+q.w, w=E.stats.words[k]=E.stats.words[k]||{n:0,ok:0}; w.n++; if(ok)w.ok++;
    const m=E.wb[S.book]||{}, e=m[lw(q.w)];
    if(!ok) wbAdd(q);
    else if(e && e.due<=today()){ e.box=(e.box||0)+1; if(e.box>=BOXDAYS.length){ delete m[lw(q.w)]; E.grad[S.book]=(E.grad[S.book]||0)+1; toast(`🎓 ${q.w} 從錯題本畢業了！`);} else e.due=addDays(BOXDAYS[e.box]); }
  }
  save();
}
function wbMap(b){return E.wb[b||S.book]=E.wb[b||S.book]||{}}
function wbAdd(q){const m=wbMap(),k=lw(q.w);const e=m[k]||{w:q.w,zh:q.zh,n:0};e.n++;e.last=today();e.box=0;e.due=addDays(1);e.zh=q.zh;m[k]=e;}
function wbList(b){const m=wbMap(b);return Object.values(m).map(e=>{const x=findWord(e.w)||{w:e.w,zh:e.zh,p:""};return Object.assign({},x,{n:e.n,last:e.last,box:e.box||0,due:e.due||today()})}).sort((a,b)=>a.due.localeCompare(b.due)||b.n-a.n)}
const dueList=b=>wbList(b).filter(x=>x.due<=today());
function streak(){let n=0;const d=new Date();for(;;){const k=dstr(d);if(E.stats.days[k]&&E.stats.days[k].n){n++;d.setDate(d.getDate()-1)}else if(n===0&&k===today()){d.setDate(d.getDate()-1)}else break}return n}

/* ---------- 單字卡 ---------- */
function shortTag(t){return t.startsWith("Lesson ")?"L"+t.slice(7):t.replace("字母 ","")}
function renderCards(){
  const b=book(); let html="",n=0,last=-1;
  items(false).forEach(it=>{
    const accent=ACCENTS[it.gi%ACCENTS.length];
    if(it.gi!==last){last=it.gi;const cnt=b.groups[it.gi].length-1;
      html+=`<div class="group-title"><span class="pill" style="background:${accent}">${esc(b.id)} · ${esc(it.title)}</span>${cnt} 張</div>`;}
    n++;
    html+=`<div class="card ${E.st.mode}" style="--accent:${accent}" data-say="${esc(it.w)}">
      <span class="tag">${esc(b.id)}·${esc(shortTag(it.title))}</span>${it.letter?`<span class="letter">${esc(it.letter)}</span>`:""}${isExt(it)?'<span class="xt">延伸</span>':""}
      <div class="pic">${picHTML(it.p)}</div>
      <div class="word ${lenCls(it.w)}">${esc(it.w)}</div>
      <div class="zh">${esc(it.zh)}</div></div>`;
  });
  $("grid").innerHTML=html;
  $("count").textContent=`共 ${n} 張`;
}

/* ---------- 選單 ---------- */
function fillBooks(){ $("bookSel").innerHTML=BOOKS.map(b=>`<option value="${b.id}">${esc(b.name)}</option>`).join(""); $("bookSel").value=S.book; fillGroups(); }
function fillGroups(){ const b=book(); $("groupSel").innerHTML='<option value="all">全部</option>'+b.groups.map((g,i)=>`<option value="${i}">${esc(g[0])}</option>`).join(""); S.group="all"; $("groupSel").value="all"; }
function syncSeg(id,attr,val){R.querySelectorAll(`#${id} button`).forEach(x=>x.classList.toggle("on",x.dataset[attr]===String(val)))}
const HINTS={cards:"點卡片聽發音。",game:"選一種遊戲開始！電腦可以按鍵盤 1～4 作答。",learn:"AC 是句型和文法，BP 是發音規則。點例子可以聽發音，最後做小練習。",parent:"給大人看的學習紀錄和設定。"};
function refresh(){
  syncSeg("viewSeg","v",S.view); syncSeg("modeSeg","mode",E.st.mode); syncSeg("accSeg","acc",E.st.acc); syncSeg("spdSeg","slow",E.st.slow?1:0); syncSeg("zySeg","zy",E.st.zy?1:0);
  ["cards","game","learn","parent"].forEach(v=>$(v+"View").classList.toggle("hidden",S.view!==v));
  $("modeSeg").style.display=S.view==="cards"?"":"none";
  $("zySeg").style.display=S.view==="learn"?"":"none";
  $("groupSel").style.display=(S.view==="cards"||S.view==="game")&&book().groups.length>1&&!S.custom?"":"none";
  $("bookSel").style.display=S.view==="parent"?"none":"";
  $("hint").firstChild.textContent=HINTS[S.view]+(S.view==="cards"&&!HOST.embedded?"列印：用瀏覽器的「列印」，A4 每頁 12 張，沿虛線剪下。":"");
  $("engroot").classList.toggle("nozy",!E.st.zy);
  voiceNote(); $("count").textContent="";
  if(S.view==="cards") renderCards(); else if(S.view==="game") gameMenu(); else if(S.view==="learn") renderLearn(); else renderParent();
}
const on=(id,ev,fn)=>$(id).addEventListener(ev,fn);
on("viewSeg","click",e=>{const b=e.target.closest("button");if(!b)return;S.view=b.dataset.v;stopGame();refresh();topScroll()});
on("modeSeg","click",e=>{const b=e.target.closest("button");if(!b)return;E.st.mode=b.dataset.mode;save();refresh()});
on("evBtn","click",()=>evOpen());
on("accSeg","click",e=>{const b=e.target.closest("button");if(!b)return;E.st.acc=b.dataset.acc;save();syncSeg("accSeg","acc",E.st.acc);voiceNote();speak("Hello");if(S.view==="parent")renderParent()});
on("spdSeg","click",e=>{const b=e.target.closest("button");if(!b)return;E.st.slow=b.dataset.slow==="1";save();syncSeg("spdSeg","slow",E.st.slow?1:0);speak("Hello")});
on("zySeg","click",e=>{const b=e.target.closest("button");if(!b)return;E.st.zy=b.dataset.zy==="1";save();refresh()});
on("bookSel","change",e=>{S.book=e.target.value;S.custom=null;save();fillGroups();stopGame();refresh()});
on("groupSel","change",e=>{S.group=e.target.value;stopGame();refresh()});
const rootClick=e=>{const t=e.target.closest&&e.target.closest("[data-say]");if(t&&!t.closest("#gwrap .choice")) speak(t.dataset.say)};
R.addEventListener("click",rootClick);

/* ---------- 學習重點 ---------- */
const TOPIC={};
const U=s=>LEARN.ui[s]||esc(s);
function enHTML(s){return esc(s).replace(/\[([^\]]+)\]/g,"<em>$1</em>").replace(/\(([^)]+)\)/g,'<span class="paren">($1)</span>')}
const plainEn=s=>s.replace(/[\[\]]/g,"").replace(/[()]/g,"");
function wordPic(w){const x=findWord(w);return x?picHTML(x.p):""}
// BP 每一課對應的發音規則（用來挑出整本書裡符合規則的字）
const RULES={
 BP1:{sa:/^[^aeiou]*a[^aeiouyw]+$/,se:/^[^aeiou]*e[^aeiouyw]+$/,si:/^[^aeiou]*i[^aeiouyw]+$/,so:/^[^aeiou]*o[^aeiouyw]+$/,su:/^[^aeiou]*u[^aeiouyw]+$/,

function sayCycle(){

function choose(i){

function next(){ if(!G)return; G.i++; if(G.i>=G.qs.length) finish(); else if(G.id==="order"||G.id==="fill") renderS(); else renderQ(); }
function drawSpell(){
  $("slots").innerHTML=G.letters.map((_,i)=>{const t=G.filled[i];return `<div class="slot ${t!==undefined?"f":""}" data-act="undo">${t!==undefined?G.tiles[t]:""}</div>`}).join("");

function tapTile(i){
  if(!G||G.locked||G.filled.includes(i))return;
  G.filled.push(i); drawSpell();
  if(G.filled.length<G.letters.length) return;
  const typed=G.filled.map(t=>G.tiles[t]).join(""), q=G.q, fb=$("fb");
  if(typed===G.letters.join("")){
    G.locked=true; $("slots").classList.add("ok");
    if(G.wrong===0){G.score++;record(q,true)} else {G.missed.push(q); G.log.push({q,pick:`<b>${esc(G.firstTyped)}</b>`});}
    fb.className="feedback ok"; fb.innerHTML=`拼對了！ ${esc(q.w)}　${esc(q.zh)}`;
    sfx(true); later(()=>speak(q.w),300); later(next,E.st.slow?2000:1500);
  }else{
    G.wrong++; sfx(false); if(G.wrong===1){G.firstTyped=typed;record(q,false)}
    const s=$("slots"); s.classList.add("shake");
    if(G.wrong>=2){
      G.locked=true; G.missed.push(q); G.log.push({q,pick:`<b>${esc(G.firstTyped)}</b>、<b>${esc(typed)}</b>`});
      later(()=>{ s.classList.remove("shake"); s.classList.add("reveal"); s.innerHTML=G.letters.map(c=>`<div class="slot f">${c}</div>`).join("");

      later(next,E.st.slow?3200:2700);
    }else{ fb.className="feedback bad"; fb.textContent="差一點！再試一次"; later(()=>{G.filled=[];drawSpell();s.classList.remove("shake")},500); }
  }

function startMemory(pool){
  let picks=pool.slice(0,6);
  if(picks.length<4){ const extra=shuffle(usable(items(true),true)).filter(x=>!picks.some(p=>lw(p.w)===lw(x.w)||p.p===x.p)); picks=picks.concat(extra).slice(0,6); }
  const cards=shuffle(picks.flatMap((x,k)=>[{k,t:"p"},{k,t:"w"}]));
  G={id:"memory",picks,cards,open:[],done:new Set(),tries:0,matched:0,pairs:picks.length,locked:true,score:0,missed:[],log:[]};
  drawMemory(true);
  let left=5; $("fb").textContent=`先記住位置！ ${left}`;
  const tick=()=>{ if(!G||G.id!=="memory")return; left--; if(left>0){$("fb").textContent=`先記住位置！ ${left}`;later(tick,1000)} else {$("fb").textContent="開始翻牌！";G.locked=false;drawMemory(false)} };
  later(tick,1000);
}
function drawMemory(peek){
  const cells=G.cards.map((c,i)=>{const x=G.picks[c.k];const up=peek||G.open.includes(i)||G.done.has(c.k);
    const face=c.t==="p"?`<div class="gpic">${picHTML(x.p)}</div>`:`<div class="word ${lenCls(x.w)}">${esc(x.w)}</div>`;
    return `<button class="mcard ${up?"up":""} ${G.done.has(c.k)?"done":""}" data-m="${i}"><div class="in"><div class="f">?</div><div class="b">${face}</div></div></button>`}).join("");
  const old=$("fb")?$("fb").textContent:"";
  $("gwrap").innerHTML=head()+`<div class="stage"><div>把「圖」和「英文單字」配成一對</div><div class="mem">${cells}</div><div class="feedback" id="fb">${esc(old)}</div></div>`;
}
function flip(i){
  if(!G||G.locked)return; const c=G.cards[i];
  if(G.done.has(c.k)||G.open.includes(i))return;
  G.open.push(i); R.querySelector(`#gwrap [data-m="${i}"]`).classList.add("up");
  if(c.t==="w") speak(G.picks[c.k].w);
  if(G.open.length<2) return;
  G.tries++; G.locked=true;
  const [a,b]=G.open.map(j=>G.cards[j]);
  if(a.k===b.k){
    G.done.add(a.k); G.matched++; G.open=[]; sfx(true); dayRec().n++; dayRec().ok++; save();
    later(()=>speak(G.picks[a.k].w),250);
    later(()=>{ G.locked=false; $("fb").textContent=`配對成功！ ${G.picks[a.k].w}　${G.picks[a.k].zh}`; drawMemory(false); if(G.matched===G.pairs) later(finish,1200); },500);
  }else{ sfx(false); later(()=>{G.open=[];G.locked=false;drawMemory(false)},1000); }
}
/* 句子遊戲（AC） */
function startSentence(id){
  const pool=id==="order"?sentPool():fillPool();

  const n=Math.min(id==="order"?8:10,Math.max(pool.length,4)), qs=[];
  while(qs.length<n){for(const x of shuffle(pool)){if(qs.length<n&&(pool.length===1||qs[qs.length-1]!==x))qs.push(x)}}

  renderS();
}
function renderS(){
  const q=G.qs[G.i]; G.q=q; G.locked=false; G.choices=null; let body="";
  if(G.id==="order"){
    G.words=q.en.split(/\s+/); let ord=shuffle(G.words.map((w,i)=>i)); let t=0; while(ord.map(i=>G.words[i]).join(" ")===q.en&&t++<10)ord=shuffle(ord);
    G.tiles=ord.map(i=>G.words[i]); G.filled=[]; G.wrong=0;

function drawOrder(){

function tapWord(i){
  if(!G||G.locked||G.filled.includes(i))return; G.filled.push(i); drawOrder();

  const typed=G.filled.map(t=>G.tiles[t]).join(" "), q=G.q, fb=$("fb");
  if(typed===q.en){ G.locked=true; $("sline").classList.add("ok"); if(G.wrong===0)G.score++; else {G.missed.push(q);G.log.push({q,pick:G.firstTyped})}

  else{ G.wrong++; sfx(false); if(G.wrong===1)G.firstTyped=typed; const s=$("sline"); s.classList.add("shake");

function chooseS(i){

function finish(){

function zcHTML(c,r){

}
function rubyRun(run){
const r=ZY.Z[run];let rd;if(r)rd=r.split(" ");else{const ch=[...run];rd=[];for(let i=0;i<ch.length;){const w=ZY.W&&ZY.W[ch[i]+(ch[i+1]||"")];if(w&&i+1<ch.length){rd.push(...w.split(" "));i+=2;}else{rd.push(ZY.D[ch[i]]||"");i++;}}}
  const sp=document.createElement("span");sp.innerHTML=[...run].map((c,i)=>zcHTML(c,rd[i])).join("");return sp;
}
const ZSEL=".qtext,.opt,.feedback,.passage,.qtitle .ttl,.lv .t .ttl,.result h2,.result p,.hint,.zyok";
function zyNode(el){
  const w=document.createTreeWalker(el,NodeFilter.SHOW_TEXT,{acceptNode(n){
    const p=n.parentElement;if(!p||p.closest(".zc,script,style,svg,textarea,input,.nozy"))return NodeFilter.FILTER_REJECT;
    return /[㐀-鿿]/.test(n.nodeValue)?NodeFilter.FILTER_ACCEPT:NodeFilter.FILTER_REJECT;}});
  const nodes=[];while(w.nextNode())nodes.push(w.currentNode);
  for(const n of nodes){const s=n.nodeValue,frag=document.createDocumentFragment();let last=0;
    s.replace(HAN,(run,idx)=>{if(idx>last)frag.append(s.slice(last,idx));frag.append(rubyRun(run));last=idx+run.length;return run;});

}

/* =================== 音樂與音效 =================== */
const Sound=(function(){
  let ctx=null,master,music,sfxG,timer=null,theme=null,step=0,nextT=0,noiseBuf=null,waveNode=null,duck=1;
  const NOTE=n=>{const m=/^([A-G])(#|b)?(\d)$/.exec(n);if(!m)return 0;
    const b={C:0,D:2,E:4,F:5,G:7,A:9,B:11}[m[1]]+(m[2]==="#"?1:m[2]==="b"?-1:0);
    return 440*Math.pow(2,((+m[3]+1)*12+b-69)/12);};
  const seq=s=>s.replace(/\|/g," ").trim().split(/\s+/);
  const CH={C:["C4","E4","G4"],Dm:["D4","F4","A4"],F:["F3","A3","C4"],Bb:["Bb3","D4","F4"],G:["G3","B3","D4"],Am:["A3","C4","E4"],Em:["E3","G3","B3"]};
  const THEMES={
    sea:{bpm:72,inst:"bell",waves:true,
      mel:seq("E5 - G5 - A5 - G5 E5 | D5 - E5 - G5 - - - | E5 - G5 - A5 - C6 A5 | G5 - E5 - D5 - - -"),
      bass:seq("C3 - - - - - - - | A2 - - - - - - - | F2 - - - - - - - | G2 - - - - - - -"),pad:["C","Am","F","G"]},
    zh:{bpm:84,inst:"zheng",block:true,
      mel:seq("D5 - B4 A4 G4 - A4 - | B4 - D5 - E5 - D5 - | B4 - A4 G4 E4 - G4 - | A4 - B4 A4 G4 - - -"),
      bass:seq("G2 - - - D3 - - - | E2 - - - B2 - - - | C3 - - - G2 - - - | D3 - - - G2 - - -")},
    math:{bpm:112,inst:"marimba",tick:true,
      mel:seq("C5 E5 G5 E5 C5 - G4 - | A4 C5 E5 C5 A4 - - - | F4 A4 C5 A4 G4 B4 D5 B4 | C5 - G4 - C5 - - -"),
      bass:seq("C3 - G2 - C3 - G2 - | A2 - E2 - A2 - E2 - | F2 - C3 - G2 - D3 - | C3 - G2 - C3 - - -")},
    life:{bpm:100,inst:"uke",birds:true,
      mel:seq("A4 - C5 - F5 - E5 D5 | C5 - A4 - G4 - - - | A4 - C5 - D5 - F5 - | E5 D5 C5 - A4 - - -"),
      bass:seq("F2 - - - C3 - - - | D2 - - - A2 - - - | Bb2 - - - F2 - - - | C3 - - - G2 - - -"),strum:["F","Dm","Bb","C"]},
    study:{bpm:80,inst:"marimba",
      mel:seq("E5 - D5 - C5 - D5 - | E5 - G5 - E5 - - - | D5 - C5 - A4 - C5 - | D5 - - - - - - -"),
      bass:seq("C3 - - - G2 - - - | A2 - - - E2 - - - | F2 - - - C3 - - - | G2 - - - - - - -"),pad:["C","Am","F","G"]},
    cave:{bpm:66,inst:"bell",
      mel:seq("A4 - C5 - E5 - - - | D5 - C5 - A4 - - - | G4 - A4 - C5 - - - | B4 - G4 - A4 - - -"),
      bass:seq("A2 - - - - - - - | F2 - - - - - - - | C3 - - - - - - - | E2 - - - - - - -"),pad:["Am","F","C","Em"]}
  };
  function ensure(){
    if(ctx)return ctx;
    try{ctx=new (window.AudioContext||window.webkitAudioContext)();}catch(e){return null;}
    master=ctx.createGain();master.gain.value=0.9;master.connect(ctx.destination);
    music=ctx.createGain();music.gain.value=ST.music?0.32:0;music.connect(master);
    sfxG=ctx.createGain();sfxG.gain.value=ST.sfx?0.8:0;sfxG.connect(master);
    noiseBuf=ctx.createBuffer(1,ctx.sampleRate*2,ctx.sampleRate);
    const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
    return ctx;
  }
  function env(g,t,a,peak,dec){g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(peak,t+a);g.gain.exponentialRampToValueAtTime(0.0001,t+a+dec);}
  function tone(freq,t,{type="sine",vol=.3,a=.005,dec=.5,dest,detune=0}={}){
    const o=ctx.createOscillator(),g=ctx.createGain();o.type=type;o.frequency.value=freq;o.detune.value=detune;
    env(g,t,a,vol,dec);o.connect(g);g.connect(dest||music);o.start(t);o.stop(t+a+dec+.05);return o;}
  function inst(name,f,t,vol,dest){
    if(name==="bell"){tone(f,t,{vol:vol*.6,dec:1.4,dest});tone(f*2,t,{vol:vol*.18,dec:.8,dest});tone(f*3.01,t,{vol:vol*.06,dec:.5,dest});}
    else if(name==="zheng"){const o=tone(f,t,{type:"triangle",vol:vol*.7,dec:.9,dest});o.frequency.setValueAtTime(f*1.012,t);o.frequency.exponentialRampToValueAtTime(f,t+.12);tone(f*2,t,{vol:vol*.15,dec:.35,dest});}
    else if(name==="marimba"){tone(f,t,{vol:vol*.8,dec:.35,dest});tone(f*4,t,{vol:vol*.12,dec:.08,dest});}
    else if(name==="uke"){const o=ctx.createOscillator(),fl=ctx.createBiquadFilter(),g=ctx.createGain();o.type="sawtooth";o.frequency.value=f;
      fl.type="lowpass";fl.frequency.setValueAtTime(2600,t);fl.frequency.exponentialRampToValueAtTime(700,t+.4);
      env(g,t,.004,vol*.35,.55);o.connect(fl);fl.connect(g);g.connect(dest||music);o.start(t);o.stop(t+.7);}
    else if(name==="bass"){tone(f,t,{type:"triangle",vol:vol,dec:.6,dest});}
  }
  function noise(t,dur,{freq=1200,q=1,vol=.2,type="bandpass",dest}={}){
    const s=ctx.createBufferSource();s.buffer=noiseBuf;const fl=ctx.createBiquadFilter();fl.type=type;fl.frequency.value=freq;fl.Q.value=q;
    const g=ctx.createGain();env(g,t,.005,vol,dur);s.connect(fl);fl.connect(g);g.connect(dest||music);s.start(t);s.stop(t+dur+.05);return {s,fl,g};}
  function startWaves(){
    if(waveNode)return;const s=ctx.createBufferSource();s.buffer=noiseBuf;s.loop=true;
    const fl=ctx.createBiquadFilter();fl.type="lowpass";fl.frequency.value=500;
    const g=ctx.createGain();g.gain.value=0.05;const lfo=ctx.createOscillator(),lg=ctx.createGain();lfo.frequency.value=0.12;lg.gain.value=0.045;
    lfo.connect(lg);lg.connect(g.gain);s.connect(fl);fl.connect(g);g.connect(music);s.start();lfo.start();waveNode={s,lfo,g};}
  function stopWaves(){if(!waveNode)return;try{waveNode.s.stop();waveNode.lfo.stop();}catch(e){}waveNode=null;}
  function schedule(){
    if(!ctx||!theme||!THEMES[theme])return;const th=THEMES[theme],spb=60/th.bpm/2; // 8th note
    while(nextT<ctx.currentTime+0.25){
      const i=step%32,t=nextT;
      const m=th.mel[i];if(m&&m!=="-")inst(th.inst,NOTE(m),t,.32);
      const b=th.bass[i];if(b&&b!=="-")inst("bass",NOTE(b),t,.22);
      const bar=Math.floor(i/8);
      if(th.pad&&i%8===0)CH[th.pad[bar]].forEach(n=>tone(NOTE(n),t,{vol:.05,a:.6,dec:spb*8,detune:(Math.random()-.5)*8}));
      if(th.strum&&i%2===0)CH[th.strum[bar]].forEach((n,k)=>inst("uke",NOTE(n),t+k*.018,i%4===0?.18:.1));
      if(th.tick&&i%2===1)noise(t,.04,{freq:8000,q:.8,vol:.05});
      if(th.block&&i%4===0)tone(i%8===0?820:620,t,{vol:.08,dec:.06});
      if(th.birds&&Math.random()<.035){const f=2200+Math.random()*1400;const o=tone(f,t,{vol:.05,dec:.12});o.frequency.exponentialRampToValueAtTime(f*1.5,t+.1);}
      nextT+=spb;step++;
    }
  }
  function play(name){
    if(theme===name)return; theme=name;
    if(!ensure())return;
    step=0;nextT=ctx.currentTime+0.1;
    if(THEMES[name]&&THEMES[name].waves)startWaves();else stopWaves();
    if(!timer)timer=setInterval(schedule,60);
  }
  function sfx(name){
    if(!ST.sfx||!ensure())return; const t=ctx.currentTime+0.01, d=sfxG;
    if(name==="click")tone(880,t,{vol:.15,dec:.06,dest:d});
    else if(name==="correct"){["C5","E5","G5","C6"].forEach((n,i)=>inst("marimba",NOTE(n),t+i*.08,.5,d));tone(NOTE("E6"),t+.34,{vol:.12,dec:.6,dest:d});}
    else if(name==="wrong"){tone(NOTE("E4"),t,{type:"triangle",vol:.25,dec:.22,dest:d});tone(NOTE("C4"),t+.18,{type:"triangle",vol:.25,dec:.35,dest:d});}
    else if(name==="shell"){tone(1760,t+.05,{vol:.12,dec:.4,dest:d});tone(2637,t+.12,{vol:.1,dec:.5,dest:d});}
    else if(name==="whoosh"){const n=noise(t,.7,{freq:400,q:.7,vol:.18,dest:d});n.fl.frequency.exponentialRampToValueAtTime(2400,t+.6);}
    else if(name==="flag"){["G5","C6"].forEach((n,i)=>tone(NOTE(n),t+i*.09,{vol:.16,dec:.3,dest:d}));}
    else if(name==="complete"){["C5","E5","G5"].forEach((n,i)=>inst("marimba",NOTE(n),t+i*.12,.5,d));["C5","E5","G5","C6"].forEach(n=>tone(NOTE(n),t+.42,{vol:.1,a:.02,dec:1.2,dest:d}));}
    else if(name==="buy"){["E6","G6","C7"].forEach((n,i)=>tone(NOTE(n),t+i*.07,{vol:.12,dec:.35,dest:d}));noise(t,.15,{freq:6000,q:2,vol:.06,dest:d});}
    else if(name==="star"){tone(NOTE("A6"),t,{vol:.12,dec:.5,dest:d});tone(NOTE("E7"),t+.06,{vol:.06,dec:.4,dest:d});}
  }
  function apply(){if(!ctx)return;music.gain.setTargetAtTime(ST.music?0.32*duck:0,ctx.currentTime,.1);sfxG.gain.setTargetAtTime(ST.sfx?0.8:0,ctx.currentTime,.05);}
  function setDuck(on){duck=on?.25:1;apply();}
  function unlock(){if(ensure()&&ctx.state==="suspended")ctx.resume();}
  return {play,sfx,apply,unlock,setDuck};
})();

function clockSVG(h,m){

  for(let i=0;i<60;i++){const a=i*6*Math.PI/180,big=i%5===0,r1=big?82:90,r2=96;
    s+=`<line x1="${110+r1*Math.sin(a)}" y1="${110-r1*Math.cos(a)}" x2="${110+r2*Math.sin(a)}" y2="${110-r2*Math.cos(a)}" stroke="#1f3347" stroke-width="${big?3:1.2}"/>`;}
  for(let n=1;n<=12;n++){const a=n*30*Math.PI/180;
    s+=`<text x="${110+66*Math.sin(a)}" y="${110-66*Math.cos(a)+8}" text-anchor="middle" font-size="22" font-weight="700" fill="#1f3347" font-family="Noto Sans TC,sans-serif">${n}</text>`;}
  const ma=m*6*Math.PI/180,ha=((h%12)*30+m*.5)*Math.PI/180;
  s+=`<line x1="110" y1="110" x2="${110+48*Math.sin(ha)}" y2="${110-48*Math.cos(ha)}" stroke="#e8743b" stroke-width="9" stroke-linecap="round"/>`;
  s+=`<line x1="110" y1="110" x2="${110+80*Math.sin(ma)}" y2="${110-80*Math.cos(ma)}" stroke="#2f80c9" stroke-width="5" stroke-linecap="round"/><circle cx="110" cy="110" r="7" fill="#1f3347"/></svg>`;
  return s;
}

  return `<div class="topbar"><div class="brand">🏝️ 島嶼探險隊</div><div class="spacer"></div>
  ${toggles()}
  ${p?`<span class="pill">${p.avatar} <span class="nozy">${esc(p.name)}</span></span><button class="pill" id="shellPill" style="border:none;font-size:inherit;font-family:inherit;cursor:pointer" title="貝殼商店">🐚 ${p.shells||0}</button>`:""}
  ${extra||""}</div>`;
}
let rerender=()=>{};
function bindToggles(root){
  root.querySelectorAll("[data-tog]").forEach(b=>b.onclick=(e)=>{
    e.stopPropagation();const k=b.dataset.tog;ST[k]=!ST[k];save();if(k==="zhuyin")try{localStorage.setItem("ttZhuyin",ST.zhuyin?"1":"0")}catch(e){}
    document.body.classList.toggle("zy",ST.zhuyin);Sound.apply();Sound.sfx("click");rerender();});
}
function finish(root){bindToggles(root);applyZhuyin(root);const sp=root.querySelector("#shellPill");if(sp)sp.onclick=()=>{Sound.sfx("click");showShop();};}

// ---- 遊戲全螢幕模式
function gFull(fix,music){
  document.body.classList.add("gfull");document.body.classList.toggle("gfix",!!fix);try{window.scrollTo(0,0)}catch(e){}
  return `<div class="gfab"><button id="gfback" title="回地圖" aria-label="回地圖">🏝️</button>${music?`<button id="gfmus" title="背景音樂">${ST.music?"🎵":"🔇"}</button>`:""}</div>`;}
function gFullBind(back){
  const t0=Date.now(),ok=()=>Date.now()-t0>700;  // 剛進島的那一下點擊不算（避免手指點島時，同一下又按到回地圖）
  const b=document.getElementById("gfback");if(b)b.onclick=e=>{if(!ok())return;Sound.sfx("click");back();};
  const m=document.getElementById("gfmus");if(m)m.onclick=e=>{if(!ok())return;ST.music=!ST.music;save();Sound.apply();m.textContent=ST.music?"🎵":"🔇";};}
function gFullOff(){document.body.classList.remove("gfull","gfix");}
function setPage(html,{overlay=true}={}){
  engStop();gFullOff();
  $app.className=overlay?"overlay":"";
  $app.innerHTML=`<div class="wrap">${html}</div>`;
  finish($app);
}

/* =================== 3D 世界 =================== */
let World=null, worldTried=false, worldFocus=null;
async function ensureWorld(){
  if(World||worldTried)return World;
  worldTried=true;
  if(ST.lite)return null;
  try{
    const t=document.createElement("canvas");if(!(t.getContext("webgl2")||t.getContext("webgl")))throw new Error("no webgl");
    const tryImp=(u,ms)=>Promise.race([import(u),new Promise((_,rj)=>setTimeout(()=>rj(new Error("timeout "+u)),ms))]);
    let THREE=null;
    for(const [u,ms] of [["./three.module.min.js",9000],[THREE_URL,12000]]){try{THREE=await tryImp(u,ms);if(THREE&&THREE.WebGLRenderer)break;}catch(e){console.warn("three 載入失敗",u,e);THREE=null;}}
    if(!THREE)throw new Error("three 無法載入");
    try{await Promise.race([document.fonts.ready,new Promise(r=>setTimeout(r,1500))]);}catch(e){}
    World=buildWorld(THREE);
  }catch(e){console.warn("3D 無法啟動，改用平面地圖",e);World=null;}
  return World;
}

function buildWorld(THREE){
  const renderer=new THREE.WebGLRenderer({canvas:$cv,antialias:true});
  renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
  renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
  const scene=new THREE.Scene();
  // sky
  const sky=document.createElement("canvas");sky.width=4;sky.height=256;const sg=sky.getContext("2d");
  const grd=sg.createLinearGradient(0,0,0,256);grd.addColorStop(0,"#4fb3ff");grd.addColorStop(.55,"#a9e4ff");grd.addColorStop(.85,"#ffe3f1");grd.addColorStop(1,"#fff4dc");
  sg.fillStyle=grd;sg.fillRect(0,0,4,256);const skyTex=new THREE.CanvasTexture(sky);skyTex.colorSpace=THREE.SRGBColorSpace;
  scene.background=skyTex;scene.fog=new THREE.Fog(0xd7f1ff,80,190);
  const camera=new THREE.PerspectiveCamera(42,1,.5,400);
  scene.add(new THREE.HemisphereLight(0xffffff,0x4fb8c9,1.2));
  const sun=new THREE.DirectionalLight(0xfff1d6,1.7);sun.position.set(30,55,25);sun.castShadow=true;
  sun.shadow.mapSize.set(2048,2048);Object.assign(sun.shadow.camera,{left:-75,right:75,top:75,bottom:-75,near:1,far:200});

  const M=(c,o={})=>new THREE.MeshStandardMaterial(Object.assign({color:c,flatShading:true,roughness:.85},o));
  const mesh=(g,m,cast=true,recv=false)=>{const x=new THREE.Mesh(g,m);x.castShadow=cast;x.receiveShadow=recv;return x;};
  function jitter(geo,amt,seed=1){const p=geo.attributes.position;let s=seed;const rnd=()=>{s=(s*9301+49297)%233280;return s/233280-.5;};
    const map={};for(let i=0;i<p.count;i++){const k=p.getX(i).toFixed(2)+","+p.getY(i).toFixed(2)+","+p.getZ(i).toFixed(2);
      if(!map[k])map[k]=[rnd()*amt,rnd()*amt*.5,rnd()*amt];const d=map[k];p.setXYZ(i,p.getX(i)+d[0],p.getY(i)+d[1],p.getZ(i)+d[2]);}
    geo.computeVertexNormals();return geo;}

  // water
  const wGeo=new THREE.PlaneGeometry(760,760,100,100);wGeo.rotateX(-Math.PI/2);
  const wBase=Float32Array.from(wGeo.attributes.position.array);
  const water=mesh(wGeo,M(0x22b8d8,{roughness:.28,metalness:.05}),false,true);scene.add(water);

  function textTex(lines,{w=512,h=160,bg="#ffffff",border="#f2b632",color="#1f3347",sizes=[56,30]}={}){
    const c=document.createElement("canvas");c.width=w;c.height=h;const g=c.getContext("2d");
    g.fillStyle=bg;g.strokeStyle=border;g.lineWidth=10;const r=36;
    g.beginPath();g.moveTo(r,6);g.arcTo(w-6,6,w-6,h-6,r);g.arcTo(w-6,h-6,6,h-6,r);g.arcTo(6,h-6,6,6,r);g.arcTo(6,6,w-6,6,r);g.closePath();g.fill();g.stroke();
    g.fillStyle=color;g.textAlign="center";g.textBaseline="middle";
    const tot=lines.length;lines.forEach((t,i)=>{let sz=sizes[i]||30;g.font=`900 ${sz}px "Noto Sans TC",sans-serif`;while(g.measureText(t).width>w-56&&sz>14){sz-=2;g.font=`900 ${sz}px "Noto Sans TC",sans-serif`;}
      g.fillText(t,w/2,tot===1?h/2:(i===0?h*.38:h*.74));});
    const tex=new THREE.CanvasTexture(c);tex.colorSpace=THREE.SRGBColorSpace;tex.anisotropy=4;return tex;}
  function label(lines,scale,opts){const sp=new THREE.Sprite(new THREE.SpriteMaterial({map:textTex(lines,opts),depthTest:false,transparent:true}));
    sp.scale.set(scale,scale*(opts&&opts.h?opts.h:160)/((opts&&opts.w)||512),1);sp.renderOrder=10;return sp;}

  function palm(h=4){const g=new THREE.Group();const segs=5;let y=0,x=0;
    for(let i=0;i<segs;i++){const s=mesh(new THREE.CylinderGeometry(.22-i*.02,.26-i*.02,h/segs,6),M(0x9a6a3a));s.position.set(x,y+h/segs/2,0);s.rotation.z=-.06*i;g.add(s);y+=h/segs*.98;x+=.08*i;}

  function flowers(g,rIn,rOut,y,n,seed,skip){

    const geo=new THREE.IcosahedronGeometry(.17,0);const im=new THREE.InstancedMesh(geo,new THREE.MeshStandardMaterial({roughness:.6,flatShading:true}),n);
    const m=new THREE.Matrix4(),c=new THREE.Color();let k=0;
    for(let i=0;i<n*3&&k<n;i++){const a=rnd()*Math.PI*2,r=rIn+rnd()*(rOut-rIn);if(skip&&r>skip[0]&&r<skip[1])continue;

  function lagoon(x,z,r){const m=new THREE.Mesh(new THREE.CircleGeometry(r,40),new THREE.MeshBasicMaterial({color:0x7ff0e6,transparent:true,opacity:.5,depthWrite:false}));

let VOICES=[];
function loadVoices(){try{VOICES=(window.speechSynthesis&&speechSynthesis.getVoices())||[];}catch(e){VOICES=[];}}
try{if(window.speechSynthesis){loadVoices();speechSynthesis.addEventListener("voiceschanged",loadVoices);}}catch(e){}
const isGoogleTW=v=>!!v&&/google/i.test(v.name)&&(/(國語|臺灣|台灣|taiwan)/i.test(v.name)||/zh[-_]tw/i.test(v.lang));
function zhVoices(){return VOICES.filter(v=>vScore(v)>=0).sort((a,b)=>vScore(b)-vScore(a));}
// 聲音分類：臺灣口音優先，再看是不是高品質（自然語音／加強版）
const vTW=v=>/(zh|cmn)[-_](hant[-_])?tw/i.test(v.lang)||/(臺灣|台灣|taiwan|國語)/i.test(v.name);
const vHK=v=>/(zh|yue)[-_](hant[-_])?hk|yue/i.test(v.lang)||/(香港|粵|cantonese|hong kong)/i.test(v.name);
function vScore(v){if(!(/^(zh|cmn|yue)/i.test(v.lang)||/(國語|中文|普通話|chinese)/i.test(v.name)))return -1;
  let sc=vTW(v)?100:vHK(v)?2:20;
  if(/natural|online|neural/i.test(v.name))sc+=30;
  if(/加強|enhanced|premium|進階|高品質|優化/i.test(v.name))sc+=25;
  if(/hsiaochen|hsiaoyu|曉臻|曉雨|美佳|mei-?jia/i.test(v.name))sc+=10;
  if(/google/i.test(v.name))sc+=3;
  return sc;}
function vTag(v){return vTW(v)?"臺灣":vHK(v)?"香港／粵語":"大陸口音";}
// 跟魔法數學大冒險、九九乘法遊樂園共用的語音設定（localStorage 的 ttVoice）
const TV=()=>{try{return JSON.parse(localStorage.getItem("ttVoice")||"{}")||{};}catch(e){return {};}};
const syncTV=()=>{try{localStorage.setItem("ttVoice",JSON.stringify({voice:ST.voice||"",rate:ST.vrate||0.9,pitch:ST.vpitch||1.1}));}catch(e){}};
function pickVoice(){
  const vs=VOICES,want=ST.voice||TV().voice;
  if(want){const v=vs.find(v=>v.name===want);if(v)return v;}
  let best=null,bs=-1;vs.forEach(v=>{const sc=vScore(v);if(sc>bs){bs=sc;best=v;}});
  return bs>=0?best:null;
}
function speakText(t){
  return t.replace(/【延伸】/g,"延伸題，").replace(/（　）/g,"括號").replace(/○/g,"圓圈").replace(/╳/g,"叉叉")
   .replace(/(\d)\s*×\s*(\d)/g,"$1成$2").replace(/(\d)\s*[＋+]\s*(\d)/g,"$1加$2").replace(/(\d)\s*[−\-]\s*(\d)/g,"$1減$2").replace(/\s*[=＝]\s*/g,"等於")
   .replace(/→/g,"，").replace(/[「」『』]/g,"")
   .replace(/裳/g,"商").replace(/(多|秤|一樣|又|很|太)重/g,"$1眾").replace(/第一行/g,"第一航").replace(/[\u3105-\u312F˙ˊˇˋ]+/g,"").replace(/（\s*）/g,"");
}
function speak(text,{onend,rate}={}){
  try{
    if(!window.speechSynthesis)return;
    speechSynthesis.cancel();
    const clean=speakText(text),parts=[];let cur="";
    clean.split(/(?<=[。！？；，、：])/).forEach(seg=>{if((cur+seg).length>40&&cur){parts.push(cur);cur=seg;}else cur+=seg;});
    if(cur.trim())parts.push(cur);
    const v=pickVoice();Sound.setDuck(true);
    parts.forEach((c,i)=>{const u=new SpeechSynthesisUtterance(c);u.lang=v?v.lang:"zh-TW";if(v)u.voice=v;
      const tv=TV();u.rate=rate||(ST.vrate||tv.rate||0.9);u.pitch=ST.vpitch||tv.pitch||1.1;
      if(i===parts.length-1)u.onend=u.onerror=()=>{Sound.setDuck(false);onend&&onend();};
      speechSynthesis.speak(u);});
  }catch(e){}
}

function dkey(off){const d=new Date();if(off)d.setDate(d.getDate()+off);return d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate();}
function readLS(k){try{return JSON.parse(localStorage.getItem(k)||"null")}catch(e){return null}}
// ---- 乘法遊戲島：以 games.html（tt99g10）為主，第一次把島上的舊紀錄合併進去（每關取比較高的星星）
function g10Data(){const p=prof();let g=readLS("tt99g10");
  if(p&&p.g10&&!p.g10merged){g=g||{};g.st=g.st||{};const a=p.g10.st||{};
    for(const k in a){g.st[k]=g.st[k]||{};for(const l in a[k])g.st[k][l]=Math.max(g.st[k][l]||0,a[k][l]||0);}
    for(const k in p.g10)if(!(k in g))g[k]=p.g10[k];
    try{localStorage.setItem("tt99g10",JSON.stringify(g))}catch(e){}p.g10merged=1;save();}
  return g||(p&&p.g10)||null;}
// ---- 今日推薦島
function todayRec(p){p=p||prof();if(!p)return null;const d=dkey(0);if(p.todayRec&&p.todayRec.d===d)return p.todayRec;
  const lastOf=is=>{let t=0;is.levels.forEach(lv=>{const r=(p.levels||{})[lv.id];[r&&r.date,(p.reviewed||{})[lv.id]].forEach(x=>{if(x){const v=Date.parse(String(x).replace(/\//g,"-"));if(v>t)t=v;}});
    Object.keys(p.games||{}).forEach(k=>{if(k.startsWith(lv.id+"-")){const v=Date.parse(String(p.games[k].date||"").replace(/\//g,"-"));if(v>t)t=v;}});});return t;};
  const sc=ISLANDS.filter(is=>["zh","math","life"].includes(is.id)).map(is=>{let st=0;is.levels.forEach(lv=>st+=levelStars(lv.id));return {id:is.id,last:lastOf(is),ratio:st/(is.levels.length*3)};});
  sc.sort((a,b)=>(a.last-b.last)||(a.ratio-b.ratio));
  const pick=sc.find(x=>!(p.todayRec&&p.todayRec.id===x.id&&sc.length>1))||sc[0];
  p.todayRec={d,id:pick.id,done:false};save();return p.todayRec;}
function recDone(lid){const p=prof();if(!p)return;const r=todayRec(p),lv=LEVELS[lid];if(!r||r.done||!lv||lv.island.id!==r.id)return;
  r.done=true;p.shells=(p.shells||0)+3;if(p.buddy){p.buddy.inv=p.buddy.inv||{};p.buddy.inv.rice=(p.buddy.inv.rice||0)+1;}save();
  setTimeout(()=>{const m=document.createElement("div");m.className="modal";const is=ISLANDS.find(x=>x.id===r.id);
    m.innerHTML=`<div class="card result"><div style="font-size:56px">🎁</div><h2 class="zyok">完成今天的推薦島了！</h2><p class="zyok">${is?is.name:""}探險完成，書僮送你 🐚 × 3，還有 🍙 飯糰 × 1（放在書僮的點心櫃）</p><button class="btn primary" id="okr">謝謝！</button></div>`;
    document.body.appendChild(m);applyZhuyin(m);Sound.sfx("complete");m.querySelector("#okr").onclick=()=>m.remove();},1200);}

function weakFacts(){const W={};const add=(a,b,n,src)=>{a=+a;b=+b;if(!(a>=2&&a<=9&&b>=1&&b<=9)||!n)return;const k=Math.min(a,b)+"×"+Math.max(a,b);const o=W[k]=W[k]||{n:0,src:{}};o.n+=n;o.src[src]=(o.src[src]||0)+n;};
  const T=readLS("tt99");if(T&&T.facts)for(const k in T.facts){const m=/^(\d)x(\d)$/.exec(k);if(m)add(m[1],m[2],T.facts[k].w||0,"遊樂園");}
  const G=readLS("tt99game");if(G&&G.stats&&G.stats.missCnt)for(const k in G.stats.missCnt){const m=/(\d)\s*[×xX]\s*(\d)(?!\d)/.exec(k);if(m)add(m[1],m[2],G.stats.missCnt[k],"大冒險");}
  return Object.entries(W).sort((a,b)=>b[1].n-a[1].n);}
function overviewHTML(p){

    x.fillText("🏠 寵物島・書僮全家福　"+dkey(0),W/2,H-22);

      <p class="note zyok">電腦按「下載照片」；手機可以長按照片儲存。</p><div class="actrow" style="justify-content:center"><a class="btn primary" download="書僮全家福-${dkey(0)}.png" href="${url}">⬇️ 下載照片</a><button class="btn" id="pcl">關閉</button></div>`:`<p class="zyok">這台裝置沒辦法拍照。</p><button class="btn" id="pcl">關閉</button>`}</div>`;
    document.body.appendChild(m);applyZhuyin(m);m.querySelector("#pcl").onclick=()=>m.remove();Sound.sfx("star");};
