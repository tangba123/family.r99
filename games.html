<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8"/>

<title>九九乘法遊戲島</title>
<style>

.z{display:inline-flex;align-items:center;vertical-align:middle;line-height:1;margin:0 .2em 0 .03em}
.z .h{display:inline-block}
.z .b{display:inline-flex;flex-direction:column;justify-content:center;font-size:.4em;line-height:1.02;
  margin-left:.12em;min-width:1em;font-weight:400;position:relative;letter-spacing:0}
.z .b span{display:block;text-align:center;position:relative}
.z .b .l{line-height:.6}
.z .b .zt{position:absolute;left:100%;top:-.45em;font-style:normal;margin-left:-.05em}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{font-family:"PingFang TC","Microsoft JhengHei","Noto Sans TC","Noto Sans CJK TC",sans-serif;background:linear-gradient(180deg,#7fd3ff,#bfeaff 40%,#fff3c4);min-height:100vh;color:#2b2b2b;font-size:20px;overflow-x:hidden}
.nozy .z .b{display:none}.nozy .z{margin:0}
.wrap{max-width:860px;margin:0 auto;padding:10px 12px 40px}
.top{display:flex;flex-wrap:wrap;align-items:center;gap:8px;background:rgba(255,255,255,.85);border-radius:18px;padding:8px 12px;margin-bottom:10px;box-shadow:0 4px 0 rgba(0,0,0,.08)}
.top h1{font-size:24px;margin:0;flex:1;white-space:nowrap;color:#1a6fa3}
.stars{font-weight:900;font-size:20px;white-space:nowrap}
.pill{border:2px solid #1a6fa3;background:#fff;color:#1a6fa3;border-radius:99px;padding:3px 10px;font-size:14px;font-weight:800;cursor:pointer;font-family:inherit;white-space:nowrap}
.sea{position:relative}
.islands{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.isl{border:0;border-radius:28px;padding:12px 10px;background:radial-gradient(ellipse at 50% 85%,#f7d99a 0 45%,#7fd47f 46%);box-shadow:0 8px 0 rgba(0,0,0,.15);cursor:pointer;font-family:inherit;text-align:center;position:relative}
.isl:active{transform:translateY(4px);box-shadow:0 4px 0 rgba(0,0,0,.15)}
.isl .ic{font-size:54px;line-height:1.1}
.isl b{display:block;font-size:20px}
.isl .lv{display:flex;justify-content:center;gap:4px;margin-top:4px}
.isl .lv i{width:22px;height:22px;border-radius:50%;background:#fff;border:2px solid #ccc;font-style:normal;font-size:12px;line-height:18px}
.isl .lv i.s1{background:#ffe9a8;border-color:#e0b100}.isl .lv i.s2{background:#ffd64d;border-color:#c99a00}.isl .lv i.s3{background:#ffb800;border-color:#a87a00;color:#fff}
.isl.lock{filter:grayscale(1) brightness(.85);cursor:not-allowed}
.isl .no{position:absolute;top:6px;left:12px;font-weight:900;color:#1a6fa3;font-size:18px}
.view{display:none}.view.on{display:block}
.game{background:rgba(255,255,255,.92);border-radius:24px;padding:12px;box-shadow:0 6px 0 rgba(0,0,0,.1);min-height:520px;position:relative;overflow:hidden}
.ghead{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.ghead .t{flex:1;font-weight:900;font-size:21px}
.prog{height:12px;background:#eee;border-radius:99px;overflow:hidden;margin:4px 0 8px}
.prog i{display:block;height:100%;background:linear-gradient(90deg,#4cd18a,#2d9cdb);transition:.3s}
.q{text-align:center;font-size:44px;font-weight:900;font-family:ui-monospace,Menlo,Consolas,monospace;margin:6px 0}
.hint{text-align:center;font-size:18px;color:#555;min-height:30px}
.fb{text-align:center;font-weight:900;font-size:20px;min-height:34px;line-height:1.9}
.fb.good{color:#1a7a43}.fb.bad{color:#c0392b}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.opt{font-size:34px;font-weight:900;padding:12px 0;border-radius:18px;border:0;background:#e8f4fd;color:#1a5f8f;box-shadow:0 5px 0 #b6d6ec;cursor:pointer;font-family:inherit}
.opt:active{transform:translateY(4px);box-shadow:none}
.opt.right{background:#4cd18a;color:#fff;box-shadow:0 5px 0 #23995a}.opt.wrong{background:#ff6b6b;color:#fff;box-shadow:0 5px 0 #c03b3b}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-width:360px;margin:8px auto 0}
.pad button{font-size:28px;font-weight:900;height:56px;border-radius:14px;border:0;background:#e8f4fd;color:#1a5f8f;box-shadow:0 4px 0 #b6d6ec;cursor:pointer;font-family:inherit}
.pad button.ok{background:#4cd18a;color:#fff;box-shadow:0 4px 0 #23995a;font-size:20px;white-space:nowrap}
.ans{display:inline-block;min-width:80px;border-bottom:5px solid #2d9cdb;color:#2d9cdb}
.btn{border:0;border-radius:16px;padding:10px 18px;font-size:21px;font-weight:900;cursor:pointer;font-family:inherit;background:#2d9cdb;color:#fff;box-shadow:0 5px 0 #1a6fa3;margin:5px}
.btn.g{background:#4cd18a;box-shadow:0 5px 0 #23995a}.btn.w{background:#eee;color:#333;box-shadow:0 5px 0 #bbb}
.btn:active{transform:translateY(4px);box-shadow:none}
.ov{position:fixed;inset:0;background:rgba(0,30,60,.6);display:none;align-items:center;justify-content:center;z-index:20;padding:16px}
.ov.on{display:flex}
.card{background:#fff;border-radius:26px;padding:18px;max-width:440px;width:100%;text-align:center;box-shadow:0 10px 0 rgba(0,0,0,.25);max-height:92vh;overflow:auto;animation:pop .3s}
@keyframes pop{from{transform:scale(.7);opacity:0}}
.card h2{margin:4px 0;color:#1a6fa3;font-size:26px}
.big{font-size:56px}
.lvl{display:grid;grid-template-columns:1fr;gap:8px;margin:10px 0}
.lvl button{display:flex;align-items:center;justify-content:space-between;border:0;border-radius:16px;padding:10px 14px;font-size:20px;font-weight:800;background:#e8f4fd;cursor:pointer;font-family:inherit;box-shadow:0 4px 0 #b6d6ec}
.lvl button.lock{opacity:.5;cursor:not-allowed}
.st{color:#f2b705;letter-spacing:2px}
/* 1 氣球 */
.sky{position:relative;height:380px;border-radius:18px;background:linear-gradient(180deg,#bfe9ff,#eaf8ff);overflow:hidden}
.bal{position:absolute;bottom:-120px;width:92px;height:112px;border:0;cursor:pointer;background:none;font-family:inherit;animation:up linear forwards;padding:0}
.bal span{display:flex;align-items:center;justify-content:center;width:92px;height:100px;border-radius:50% 50% 46% 46%;color:#fff;font-size:32px;font-weight:900;box-shadow:inset -10px -10px 0 rgba(0,0,0,.12)}
.bal::after{content:'';position:absolute;left:45px;top:100px;width:2px;height:30px;background:#888}
.bal.pop{animation:none;opacity:0;transition:opacity .2s}
@keyframes up{to{transform:translateY(-520px)}}
/* 2 地鼠 */
.holes{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;max-width:440px;margin:0 auto}
.hole{height:112px;background:radial-gradient(ellipse at 50% 88%,#5a3a1a 0 34%,#8fdc8a 36%);border-radius:18px;position:relative;overflow:hidden}
.mole{position:absolute;left:50%;bottom:-110px;transform:translateX(-50%);width:88px;height:104px;border:0;background:none;cursor:pointer;transition:bottom .16s;font-family:inherit;display:flex;flex-direction:column;align-items:center;padding:0}
.mole.up{bottom:4px}.mole .mf{font-size:52px;line-height:1}
.mole b{background:#fff;color:#1a5f8f;border-radius:10px;padding:0 8px;font-size:24px;margin-top:-4px}
/* 3 翻牌 */
.memo{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;max-width:520px;margin:0 auto}
.mc{height:86px;border:0;border-radius:16px;background:linear-gradient(160deg,#2d9cdb,#6fc3f0);box-shadow:0 5px 0 #1a6fa3;cursor:pointer;font-family:inherit;font-size:26px;font-weight:900;color:transparent;position:relative}
.mc::after{content:'?';position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#fff;font-size:34px}
.mc.up{background:#fff;color:#1a5f8f}.mc.up::after{content:''}.mc.ok{background:#4cd18a;color:#fff;box-shadow:0 5px 0 #23995a}
/* 4 賽跑 */
.track{position:relative;height:150px;background:repeating-linear-gradient(90deg,#c97a3d 0 40px,#d68a4d 40px 80px);border-radius:16px;margin-bottom:6px;overflow:hidden}
.lane{position:absolute;left:0;right:0;height:50%;border-bottom:3px dashed #fff}
.lane:nth-child(2){top:50%;border:0}
.runner{position:absolute;font-size:46px;left:2%;transition:left .4s;transform:scaleX(-1)}
.finish{position:absolute;right:4%;top:0;bottom:0;width:14px;background:repeating-linear-gradient(0deg,#fff 0 12px,#222 12px 24px)}
/* 5 接水果 */
.field{position:relative;height:380px;border-radius:18px;background:linear-gradient(180deg,#d8f3ff,#fff8e6);overflow:hidden}
.fruit{position:absolute;top:-80px;width:33.33%;text-align:center;font-size:24px;font-weight:900}
.fruit span{display:inline-block;background:#fff;border:3px solid #ff8a3d;border-radius:50%;width:66px;height:66px;line-height:60px}
.basket{position:absolute;bottom:6px;width:33.33%;text-align:center;font-size:60px;transition:left .15s}
.lanes{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}
.lanes button{height:60px;font-size:28px;border-radius:16px;border:0;background:#ffe9cf;box-shadow:0 4px 0 #e0b98a;cursor:pointer}
/* 6 填表 */
.row9{display:grid;grid-template-columns:repeat(9,1fr);gap:4px;margin:8px 0}
.cell{border-radius:10px;background:#fff;border:2px solid #cfe4f3;text-align:center;padding:4px 0}
.cell small{display:block;font-size:13px;color:#888}
.cell b{font-size:24px}
.cell.blank b{color:#c0392b}.cell.cur{border-color:#ff8a3d;background:#fff4e6}
.tiles{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:8px}
.tile{font-size:28px;font-weight:900;width:72px;height:60px;border-radius:14px;border:0;background:#fff3c4;box-shadow:0 4px 0 #e0c060;cursor:pointer;font-family:inherit}
.tile.used{visibility:hidden}
/* 7 天平 */
.scale{position:relative;height:200px;margin:10px auto;max-width:460px}
.beam{position:absolute;left:5%;right:5%;top:60px;height:10px;background:#8a5a2b;border-radius:6px;transition:transform .5s;transform-origin:50% 50%}
.pan{position:absolute;top:-56px;width:150px;text-align:center;font-size:26px;font-weight:900;background:#fff;border:3px solid #8a5a2b;border-radius:14px;padding:6px 0}
.pan.l{left:-20px}.pan.r{right:-20px}
.post{position:absolute;left:50%;top:66px;width:12px;height:110px;background:#8a5a2b;transform:translateX(-50%)}
.base{position:absolute;left:50%;bottom:0;width:140px;height:14px;background:#8a5a2b;transform:translateX(-50%);border-radius:8px}
/* 8 點點 */
.dots{display:inline-grid;gap:6px;padding:10px;background:#fff;border-radius:16px;border:3px solid #cfe4f3}
.dots i{width:22px;height:22px;border-radius:50%;display:block}
/* 10 真假 */
.tf{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px}
.tf button{font-size:44px;height:110px;border-radius:22px;border:0;cursor:pointer;font-weight:900}
.tf .y{background:#d9f7e5;box-shadow:0 6px 0 #8fd6aa}.tf .n{background:#ffe1e1;box-shadow:0 6px 0 #f0a0a0}
.timer{height:10px;background:#eee;border-radius:99px;overflow:hidden}
.timer i{display:block;height:100%;background:#ff8a3d}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:30}
@media(max-width:520px){.top h1{font-size:19px;flex-basis:100%}.ghead{flex-wrap:wrap}.ghead .t{order:3;flex-basis:100%;text-align:center}.isl .ic{font-size:42px}.isl b{font-size:16px}.q{font-size:36px}.opt{font-size:28px}.pan{width:120px;font-size:20px}.cell b{font-size:18px}.row9{grid-template-columns:repeat(5,1fr)}.memo .mc{height:70px;font-size:20px}}
</style>
</head>
<body>
<!-- ===== 帳號登入（Firebase）：只用在 GitHub Pages 分享版 ===== -->
<style>
#gate{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;background:linear-gradient(180deg,#9fd8f0,#4aa8d8);font-family:"Noto Sans TC",system-ui,sans-serif}
#gate .gbox{background:#fffdf8;border-radius:24px;padding:28px 26px;width:min(92vw,380px);box-shadow:0 10px 30px #0003;text-align:center}
#gate h1{margin:0 0 4px;font-size:28px}#gate p{margin:4px 0 16px;color:#666;font-size:15px}
#gate input{width:100%;box-sizing:border-box;font:inherit;font-size:18px;padding:12px 14px;border:2px solid #e6e0d4;border-radius:14px;margin:6px 0}
#gate button{width:100%;font:inherit;font-size:19px;font-weight:700;border:0;border-radius:14px;padding:13px;margin-top:10px;background:#f2a51f;color:#fff;cursor:pointer}
#gate button:disabled{opacity:.6}
#gate .gerr{color:#e0443c;min-height:22px;font-size:15px;margin-top:8px}
#gate .gtip{font-size:12.5px;color:#888;margin-top:12px;line-height:1.6}
#acct{position:fixed;left:50%;transform:translateX(-50%);bottom:6px;z-index:60;opacity:.85;display:flex;gap:6px;align-items:center;font-family:"Noto Sans TC",system-ui,sans-serif;font-size:13px}
#acct span,#acct button{background:#fffdf8e8;border:1px solid #e6e0d4;border-radius:999px;padding:4px 10px;cursor:pointer;color:#333}
#acct span{cursor:default}
#allacct{position:fixed;inset:0;z-index:9998;background:#0006;display:flex;align-items:flex-start;justify-content:center;overflow:auto;padding:30px 10px;font-family:"Noto Sans TC",system-ui,sans-serif}
#allacct .abox{background:#fffdf8;border-radius:20px;padding:20px;width:min(96vw,760px)}
#allacct table{width:100%;border-collapse:collapse;font-size:14px}#allacct th,#allacct td{border-bottom:1px solid #e6e0d4;padding:6px;text-align:left}
#allacct .x{float:right;border:0;background:#eee;border-radius:999px;padding:6px 12px;cursor:pointer}
</style>
<div id="gate"><div class="gbox">
  <h1>🏝️ 九九乘法遊戲島</h1><p>請登入你的帳號</p>
  <form id="gform" autocomplete="on">
    <input id="guser" placeholder="帳號" autocomplete="username" autocapitalize="off" required>
    <input id="gpass" type="password" placeholder="密碼" autocomplete="current-password" required>
    <button id="gbtn" type="submit">登入</button>
  </form>
  <div class="gerr" id="gerr"></div>
  <div class="gtip">帳號由家長在後台建立。忘記密碼請找家長幫忙重設。</div>
</div></div>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import {getAuth,signInWithEmailAndPassword,onAuthStateChanged,signOut,setPersistence,browserLocalPersistence} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import {getFirestore,doc,getDoc,setDoc,collection,getDocs,serverTimestamp} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

const firebaseConfig={"apiKey": "AIzaSyBhpd4pDiVT9suLCvP4ys35qReI8OlaJQ4", "authDomain": "tangba-123.firebaseapp.com", "projectId": "tangba-123", "storageBucket": "tangba-123.firebasestorage.app", "messagingSenderId": "256828390653", "appId": "1:256828390653:web:fc76cddb05db53f4ccd294"};
const PARENT_UIDS=["9EQCZLh8l2eISIrzAP1C7cViqXi2"];      // 家長帳號（可以看全部人的紀錄）
const DOMAIN="@family.app";              // 帳號沒打 @ 時自動補上
const STORES=[["tt99g10", "data_tt99g10", "tt99g10.owner"]];   // [這頁的瀏覽器資料名稱, 雲端欄位, 主人標記]
const WATCH=new Set(STORES.map(s=>s[0]));

const app=initializeApp(firebaseConfig), auth=getAuth(app), db=getFirestore(app);
setPersistence(auth,browserLocalPersistence).catch(()=>{});
const $=id=>document.getElementById(id);
const rawSet=localStorage.setItem.bind(localStorage);
let user=null, started=false, upT=null, dirty=false;

const ERR={"auth/invalid-credential":"帳號或密碼不對，再試一次","auth/wrong-password":"帳號或密碼不對，再試一次","auth/user-not-found":"沒有這個帳號","auth/invalid-email":"帳號格式不對","auth/user-disabled":"這個帳號已經停用，請找家長","auth/too-many-requests":"試太多次了，請等一下再試","auth/network-request-failed":"網路連不上，請檢查網路"};
$("gform").addEventListener("submit",async e=>{
  e.preventDefault(); $("gerr").textContent=""; $("gbtn").disabled=true;
  let u=$("guser").value.trim().toLowerCase(); if(!u.includes("@")) u+=DOMAIN;
  try{ await signInWithEmailAndPassword(auth,u,$("gpass").value); }
  catch(err){ $("gerr").textContent=ERR[err.code]||("登入失敗："+(err.code||err.message)); $("gbtn").disabled=false; }
});

async function upload(){
  if(!user||!dirty) return; dirty=false;
  const o={email:user.email,updatedAt:serverTimestamp()}; STORES.forEach(([k,f])=>{o[f]=localStorage.getItem(k)||""});
  try{ await setDoc(doc(db,"users",user.uid),o,{merge:true}); setStat("☁️ 已同步"); }
  catch(e){ dirty=true; setStat("⚠️ 尚未同步"); }
}
function queue(){ dirty=true; setStat("☁️ 同步中…"); clearTimeout(upT); upT=setTimeout(upload,2500); }
document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="hidden"){clearTimeout(upT);upload();} });
window.addEventListener("pagehide",()=>{clearTimeout(upT);upload();});
function setStat(s){const el=$("acstat");if(el)el.textContent=s;}

onAuthStateChanged(auth,async u=>{
  if(!u){ if(started){ location.reload(); } $("gate").style.display="flex"; $("gbtn").disabled=false; return; }
  user=u; $("gate").querySelector("p").textContent="載入你的紀錄中…";
  let d={}, ok=true;
  try{ const snap=await getDoc(doc(db,"users",u.uid)); d=snap.exists()?snap.data():{}; }catch(e){ ok=false; }
  STORES.forEach(([k,f,ow])=>{
    const owner=localStorage.getItem(ow), remote=d[f]||"";
    if(!ok){ if(owner!==u.uid) localStorage.removeItem(k); }        // 離線時只用自己的紀錄
    else if(remote){ rawSet(k,remote); }
    else if(owner&&owner!==u.uid){ localStorage.removeItem(k); }    // 別人的紀錄不要帶過來
    else if(!owner&&localStorage.getItem(k)){ dirty=true; }         // 第一次登入：把這台裝置原本的紀錄搬上去
    rawSet(ow,u.uid);
  });
  start(u);
  if(dirty) upload();
});

function start(u){
  if(started) return; started=true;
  localStorage.setItem=function(k,v){ rawSet(k,v); if(WATCH.has(k)) queue(); };
  const rawRm=localStorage.removeItem.bind(localStorage); localStorage.removeItem=function(k){ rawRm(k); if(WATCH.has(k)) queue(); };
  $("gate").style.display="none";
  const name=(u.email||"").replace(DOMAIN,"");
  const bar=document.createElement("div"); bar.id="acct";
  bar.innerHTML=`<span>👤 ${name.replace(/[<>&]/g,"")}</span><span id="acstat">☁️ 已同步</span>${PARENT_UIDS.includes(u.uid)?'<button id="acall">👨‍👩‍👧 全部帳號</button>':""}<button id="acout">登出</button>`;
  document.body.appendChild(bar);
  $("acout").onclick=async()=>{ clearTimeout(upT); await upload(); [["islandExplorer.v1","","islandExplorer.owner"],["tt99game","","tt99game.owner"],["tt99","","tt99.owner"],["tt99g10","","tt99g10.owner"]].forEach(([k,,ow])=>{localStorage.removeItem(k);localStorage.removeItem(ow)}); await signOut(auth); };
  if($("acall")) $("acall").onclick=showAll;
  // 依序執行遊戲程式
  document.querySelectorAll('script[type="text/x-deferred"]').forEach(old=>{ const s=document.createElement("script"); s.textContent=old.textContent; old.replaceWith(s); });
}

async function showAll(){
  const box=document.createElement("div"); box.id="allacct"; box.innerHTML='<div class="abox"><button class="x">✕ 關閉</button><h2>👨‍👩‍👧 全部帳號的紀錄</h2><p style="font-size:13px;color:#888">隊員、貝殼等欄位是島嶼探險隊的紀錄。</p><p id="aload">讀取中…</p></div>';
  document.body.appendChild(box); box.querySelector(".x").onclick=()=>box.remove();
  try{
    const qs=await getDocs(collection(db,"users")); const rows=[];
    qs.forEach(d=>{ const v=d.data(); let m={}; try{m=JSON.parse(v.data||"{}")}catch(e){}
      const other=[["data_tt99game","數學大冒險"],["data_tt99","乘法遊樂園"],["data_tt99g10","乘法遊戲島"]].filter(([f])=>v[f]).map(([,n])=>n).join("、")||"—";
      const profs=Object.values(m.profiles||{});
      const when=v.updatedAt&&v.updatedAt.toDate?v.updatedAt.toDate().toLocaleString("zh-TW"):"—";

 function pop(){var free=[];holes.forEach(function(h,i){if(!h.classList.contains('up'))free.push(i)});if(!free.length)return;var has=[].some.call(holes,function(h){return h.classList.contains('up')&&+h.dataset.v==q.p});
  var h=holes[pick(free)],v=!has&&Math.random()<.55?q.p:pick(wrongs(q.p,q.a,q.b,3));h.dataset.v=v;h.querySelector('b').textContent=v;h.classList.add('up');later(function(){h.classList.remove('up')},2100-R.l*150)}
 holes.forEach(function(h){h.onclick=function(){if(!h.classList.contains('up'))return;h.classList.remove('up');if(+h.dataset.v==q.p){good(q);sfx('pop');holes.forEach(function(x){x.classList.remove('up')});nq()}else bad(q)}});
 every(pop,700);pop();countdown(40,function(){var t=R.ok,st=t>=12&&R.bad<=3?3:t>=8?2:t>=5?1:0;finish(st)})};
// 3 翻牌配對
GAME.memory=function(){var used={},pairs=[];while(pairs.length<6){var q=newQ();if(!used[q.p]){used[q.p]=1;pairs.push(q)}}
 var cards=[];pairs.forEach(function(q,i){cards.push({k:i,t:q.a+'×'+q.b});cards.push({k:i,t:String(q.p)})});shuffle(cards);var open=[],got=0,moves=0;
 $('gBody').innerHTML='<div class="hint">'+T('翻開兩張，算式和答案一樣就配成一對！')+'</div><div class="memo nz">'+cards.map(function(c,i){return '<button class="mc" data-i="'+i+'">'+c.t+'</button>'}).join('')+'</div><div class="fb" id="fb"></div>';
 setQ('翻開兩張牌，找出算式和答案一樣的一對');var bs=document.querySelectorAll('.mc');bs.forEach(function(b){b.onclick=function(){var i=+b.dataset.i;if(open.length>=2||b.classList.contains('up'))return;b.classList.add('up');sfx('tick');open.push(i);
  if(open.length==2){moves++;var A=cards[open[0]],B=cards[open[1]];if(A.k==B.k){got++;R.ok++;sfx('ok');bs[open[0]].classList.add('ok');bs[open[1]].classList.add('ok');var q=pairs[A.k];$('fb').className='fb good';$('fb').innerHTML='<span class="nz">'+q.a+'×'+q.b+'='+q.p+'</span>　'+kj(q.a,q.b);open=[];prog(got/6);score();
   if(got==6)later(function(){finish(moves<=9?3:moves<=13?2:1)},800)}else{R.bad++;score();sfx('no');var o=open.slice();later(function(){o.forEach(function(k){bs[k].classList.remove('up')});open=[]},850)}}}})};
// 4 賽跑大賽
GAME.race=function(){var me=0,tu=0,q,goal=10;$('gBody').innerHTML='<div class="track"><div class="lane"><span class="runner nz" id="me">🏃</span></div><div class="lane"><span class="runner nz" id="tu">🐢</span></div><div class="finish"></div></div><div class="q nz"><span id="qq"></span><span class="ans" id="ansBox">?</span></div><div class="fb" id="fb"></div>';
 $('gBody').appendChild(keypad(function(v){if(v==q.p){good(q);me++;$('me').style.left=(2+me*(86/goal))+'%';if(me>=goal){finish(tu<goal*.5?3:tu<goal*.8?2:1);return}}else bad(q);nq()}));
 function nq(){q=newQ();$('qq').textContent=q.a+' × '+q.b+' = ';setQ(mulSay(q.a,q.b))}nq();
 var speed=[5200,4600,4200,3800,3400][R.l];every(function(){tu++;$('tu').style.left=(2+tu*(86/goal))+'%';sfx('step');prog(Math.max(me,tu)/goal);if(tu>=goal)finish(0)},speed)};
// 5 接水果：10 題
GAME.catch=function(){var n=0,pos=1,q,y=-80,vals;$('gBody').innerHTML='<div class="q nz" id="qq"></div><div class="field" id="fld"><div class="basket nz" id="bk">🧺</div></div><div class="lanes"><button data-d="-1">⬅️</button><button data-d="0">⏺</button><button data-d="1">➡️</button></div><div class="fb" id="fb"></div>';
 function place(){$('bk').style.left=(pos*33.33)+'%'}place();
 document.querySelectorAll('.lanes button').forEach(function(b){b.onclick=function(){var d=+b.dataset.d;if(d==0)return;pos=Math.max(0,Math.min(2,pos+d));place();sfx('tick')}});
 R.key=function(e){if(e.key=='ArrowLeft'){pos=Math.max(0,pos-1);place()}if(e.key=='ArrowRight'){pos=Math.min(2,pos+1);place()}};
 var fr=[];function round(){if(R.done)return;if(n>=10){finish(starsBy(R.ok,10));return}n++;prog((n-1)/10);q=newQ();$('qq').textContent=q.a+' × '+q.b+' = ?';setQ(mulSay(q.a,q.b));vals=shuffle([q.p].concat(wrongs(q.p,q.a,q.b,2)));y=-80;
  fr.forEach(function(f){f.remove()});fr=vals.map(function(v,k){var d=document.createElement('div');d.className='fruit nz';d.style.left=(k*33.33)+'%';d.innerHTML='<span>'+v+'</span>';$('fld').appendChild(d);return d})}
 round();var h=380,sp=[2.2,2.6,3,3.3,3.6][R.l];
 every(function(){y+=sp*2;fr.forEach(function(f){f.style.top=y+'px'});if(y>h-130){var v=vals[pos];if(v==q.p)good(q);else bad(q);y=-9999;fr.forEach(function(f,k){f.querySelector('span').style.borderColor=vals[k]==q.p?'#4cd18a':'#ddd'});later(round,1100)}},40)};
document.addEventListener('keydown',function(e){if(R&&!R.done&&R.key)R.key(e)});
// 6 乘法表拼圖：3 排
GAME.table=function(){var rows=shuffle(LEVELS[R.l].n.slice()).concat(shuffle(LEVELS[R.l].n.slice())).slice(0,3),ri=0,blanks,ci,a;
 $('gBody').innerHTML='<div class="hint">'+T('點下面的數字，從左到右填進紅色的空格')+'</div><div id="tb"></div><div class="tiles nz" id="tiles"></div><div class="fb" id="fb"></div>';
 function row(){if(R.done)return;if(ri>=3){finish(R.bad<=1?3:R.bad<=3?2:R.bad<=6?1:0);return}a=rows[ri];ri++;prog((ri-1)/3);
  var k=R.l==4?5:4;blanks=shuffle([1,2,3,4,5,6,7,8,9]).slice(0,k).sort(function(x,y){return x-y});ci=0;draw();
  var row=[1,2,3,4,5,6,7,8,9].map(function(b){return a*b}),ex=[];[a*10,a*5+1,a*3-1,a*7+2,a*9-1,a*4+1].forEach(function(x){if(ex.length<2&&row.indexOf(x)<0&&x>0)ex.push(x)});var ts=shuffle(blanks.map(function(b){return a*b}).concat(ex));$('tiles').innerHTML=ts.map(function(v){return '<button class="tile" data-v="'+v+'">'+v+'</button>'}).join('');
  document.querySelectorAll('#tiles .tile').forEach(function(t){t.onclick=function(){var need=a*blanks[ci],v=+t.dataset.v;var q={a:a,b:blanks[ci],p:need};
   if(v==need){t.classList.add('used');ci++;good(q);draw();if(ci>=blanks.length)later(row,1000)}else bad(q)}})}
 function draw(){$('tb').innerHTML='<div style="font-weight:900;color:'+COL[a]+'">'+T('{n}的乘法',{n:a})+'</div><div class="row9 nz">'+[1,2,3,4,5,6,7,8,9].map(function(b){var bi=blanks.indexOf(b),show=bi<0||bi<ci;
  return '<div class="cell'+(bi>=0?' blank':'')+(bi==ci?' cur':'')+'"><small>'+a+'×'+b+'</small><b>'+(show?a*b:'?')+'</b></div>'}).join('')+'</div>';if(ci<blanks.length)setQ(mulSay(a,blanks[ci]))}
 row()};
// 7 天平比大小：10 題
GAME.scale=function(){var n=0,L,Rr,s;$('gBody').innerHTML='<div class="scale nz"><div class="beam" id="beam"><div class="pan l" id="pl"></div><div class="pan r" id="pr"></div></div><div class="post"></div><div class="base"></div></div><div class="opts nz" style="grid-template-columns:repeat(3,1fr)"><button class="opt" data-s="&gt;">&gt;</button><button class="opt" data-s="=">=</button><button class="opt" data-s="&lt;">&lt;</button></div><div class="fb" id="fb"></div>';
 function round(){if(R.done)return;if(n>=10){finish(starsBy(R.ok,10));return}n++;prog((n-1)/10);L=newQ();if(Math.random()<.3)Rr={a:L.b,b:L.a,p:L.p};else Rr=newQ();s=L.p>Rr.p?'>':L.p<Rr.p?'<':'=';
  $('pl').textContent=L.a+' × '+L.b;$('pr').textContent=Rr.a+' × '+Rr.b;$('beam').style.transform='rotate(0deg)';setQ('左邊'+L.a+'成'+L.b+'，右邊'+Rr.a+'成'+Rr.b+'，哪一邊比較重');R.lock=false;document.querySelectorAll('.opt').forEach(function(b){b.className='opt'})}
 document.querySelectorAll('.opt').forEach(function(b){b.onclick=function(){if(R.lock)return;R.lock=true;var ok=b.dataset.s==s;$('beam').style.transform='rotate('+(s=='>'?-8:s=='<'?8:0)+'deg)';
  $('fb').className='fb '+(ok?'good':'bad');$('fb').innerHTML=(ok?T('答對了！'):T('再想想！'))+' <span class="nz">'+L.a+'×'+L.b+'='+L.p+'　'+Rr.a+'×'+Rr.b+'='+Rr.p+'</span>';
  if(ok){R.ok++;sfx('ok')}else{R.bad++;sfx('no');R.miss.push(L.a+'×'+L.b+' '+s+' '+Rr.a+'×'+Rr.b)}score();b.classList.add(ok?'right':'wrong');later(round,1500)}});
 round()};
// 8 點點陣列：8 題
GAME.dots=function(){var n=0,q;$('gBody').innerHTML='<div class="hint">'+T('每一排都一樣多，選出正確的算式')+'</div><div style="text-align:center" id="dz"></div><div class="opts nz" id="op"></div><div class="fb" id="fb"></div>';
 function round(){if(R.done)return;if(n>=8){finish(starsBy(R.ok,8));return}n++;prog((n-1)/8);q=newQ();if(q.b==1)q.b=2,q.p=q.a*2;R.lock=false;
  var d='<div class="dots" style="grid-template-columns:repeat('+q.a+',22px)">';for(var r=0;r<q.b;r++)for(var c=0;c<q.a;c++)d+='<i style="background:'+COL[q.a]+';opacity:'+(r%2?'.65':'1')+'"></i>';$('dz').innerHTML=d+'</div><div class="hint">'+T('每排{a}個，有{b}排',{a:q.a,b:q.b})+'</div>';
  setQ('每排'+q.a+'個，有'+q.b+'排，要選哪一個算式');var ops=shuffle([[q.a,q.b,q.p,1],[q.a,q.b,q.p+q.a,0],[q.a+1,q.b,(q.a+1)*q.b,0],[q.a,q.b+1,q.a*(q.b+1),0]]);
  $('op').innerHTML=ops.map(function(o){return '<button class="opt" style="font-size:26px" data-r="'+o[3]+'">'+o[0]+' × '+o[1]+' = '+o[2]+'</button>'}).join('');
  document.querySelectorAll('#op .opt').forEach(function(b){b.onclick=function(){if(R.lock)return;R.lock=true;if(b.dataset.r=='1'){good(q);b.classList.add('right')}else{bad(q);b.classList.add('wrong');document.querySelector('#op .opt[data-r="1"]').classList.add('right')}later(round,1400)}})}
 round()};
// 9 口訣接龍：10 題
GAME.chant=function(){var n=0,q;$('gBody').innerHTML='<div class="hint">'+T('口訣的後半句是什麼？')+'</div><div class="q" id="qq" style="font-family:inherit"></div><div class="opts" id="op"></div><div class="fb" id="fb"></div>';
 function round(){if(R.done)return;if(n>=10){finish(starsBy(R.ok,10));return}n++;prog((n-1)/10);q=newQ();R.lock=false;
  $('qq').innerHTML=TZ(CN[q.a]+CN[q.b])+' ＿＿　<span class="nz" style="font-size:24px;color:#888">('+q.a+'×'+q.b+')</span>';
  setQ(CN[q.a]+CN[q.b]+'，後半句是什麼');var ps=[q.p].concat(wrongs(q.p,q.a,q.b,3)),ops=shuffle(ps.map(function(p){return p==q.p?kjAns(q.a,q.b):(p<10?'得'+CN[p]:cnNum(p))}));
  $('op').innerHTML=ops.map(function(o){return '<button class="opt" style="font-size:28px" data-v="'+o+'">'+TZ(o)+'</button>'}).join('');
  document.querySelectorAll('#op .opt').forEach(function(b){b.onclick=function(){if(R.lock)return;R.lock=true;if(b.dataset.v==kjAns(q.a,q.b)){good(q);b.classList.add('right')}else{bad(q);b.classList.add('wrong')}later(round,1500)}})}
 round()};
// 10 真假快判：40 秒
GAME.truefalse=function(){var q,shown,truth;$('gBody').innerHTML='<div class="timer"><i id="tbar"></i></div><div class="q nz" id="qq" style="font-size:52px;margin-top:20px"></div><div class="tf"><button class="y" data-v="1">⭕</button><button class="n" data-v="0">❌</button></div><div class="fb" id="fb"></div>';
 function nq(){q=newQ();truth=Math.random()<.5;shown=truth?q.p:pick(wrongs(q.p,q.a,q.b,3));$('qq').textContent=q.a+' × '+q.b+' = '+shown;setQ(q.a+'成'+q.b+'等於'+shown+'，對不對')}nq();
 document.querySelectorAll('.tf button').forEach(function(b){b.onclick=function(){if(R.done)return;if((b.dataset.v=='1')==truth)good(q);else bad(q);nq()}});
 countdown(40,function(){var t=R.ok;finish(t>=16&&R.bad<=2?3:t>=11?2:t>=7?1:0)})};

function celebrate(){var c=document.createElement('canvas');c.className='confetti';c.width=innerWidth;c.height=innerHeight;document.body.appendChild(c);var x=c.getContext('2d'),ps=[],cols=['#ffd84d','#ff8a3d','#4cd18a','#4dd2ff','#e86fb0','#9b51e0'];
 for(var i=0;i<120;i++)ps.push({x:Math.random()*c.width,y:-20-Math.random()*300,v:2+Math.random()*4,r:5+Math.random()*5,c:cols[i%6],s:Math.random()*6});
 var t=0;(function f(){x.clearRect(0,0,c.width,c.height);ps.forEach(function(p){p.y+=p.v;p.x+=Math.sin((t+p.s)/10)*2;x.fillStyle=p.c;x.fillRect(p.x,p.y,p.r,p.r*1.6)});t++;if(t<160)requestAnimationFrame(f);else c.remove()})()}
document.addEventListener('pointerdown',function(){ac()},{passive:true});
sndLabel();sayLabel();drawMap();
$('readQ').onclick=function(){if(R&&R.qs)speakTxt(R.qs)};
$('vkOpen').onclick=function(){VK.open()};
